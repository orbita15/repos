<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Море</title>
<meta name="theme-color" content="#0a1620">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1620;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
  canvas{display:block;touch-action:none;}

  #joy{
    position:fixed;width:132px;height:132px;border-radius:50%;
    right:calc(26px + env(safe-area-inset-right));
    bottom:calc(26px + env(safe-area-inset-bottom));
    background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.20), rgba(255,255,255,.06) 62%, rgba(255,255,255,.02));
    border:2px solid rgba(255,255,255,.38);
    box-shadow:0 10px 30px rgba(0,0,0,.40), inset 0 0 34px rgba(255,255,255,.09);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;
    z-index:10;transition:opacity .4s ease;
  }
  #knob{
    position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #ffffff, #c2d2df 68%, #8ea3b3);
    box-shadow:0 6px 16px rgba(0,0,0,.45), inset 0 -4px 10px rgba(0,0,0,.15);
    will-change:transform;pointer-events:none;
  }
  #hint{
    position:fixed;left:50%;transform:translateX(-50%);
    top:calc(24px + env(safe-area-inset-top));
    color:rgba(255,255,255,.92);font-size:14px;letter-spacing:.3px;
    text-shadow:0 2px 10px rgba(0,0,0,.8);pointer-events:none;z-index:11;
    transition:opacity 1.4s ease;white-space:nowrap;text-align:center;
  }
  #map{
    position:fixed;width:160px;height:160px;border-radius:50%;pointer-events:none;z-index:10;
    left:calc(18px + env(safe-area-inset-left));
    top:calc(18px + env(safe-area-inset-top));
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));
  }
  #exitFP{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:rgba(255,255,255,.85);font-size:12.5px;letter-spacing:.4px;
    text-shadow:0 2px 10px rgba(0,0,0,.85);pointer-events:none;z-index:11;
    padding:8px 16px;border-radius:20px;
    background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;transition:opacity .4s ease;
  }
  #exitFP.show{opacity:1;}

  #dialog{
    position:fixed;left:50%;bottom:180px;transform:translateX(-50%);
    max-width:80vw;padding:14px 22px;border-radius:18px;
    background:rgba(10,22,32,.85);border:1px solid rgba(255,255,255,.22);
    color:#fff;font-size:15px;line-height:1.4;letter-spacing:.2px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .35s ease;
    text-align:center;z-index:12;
  }
  #dialog.show{opacity:1;}
  #dialog .name{color:#ffd166;font-weight:700;margin-bottom:4px;font-size:13px;letter-spacing:.6px;}
</style>
</head>
<body>

<div id="hint">Джойстик — руль и газ &nbsp;·&nbsp; Проведите — камера &nbsp;·&nbsp; Двойной тап по катеру — вид от капитана</div>
<canvas id="map" width="320" height="320"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="exitFP">Двойной тап — выйти из вида капитана</div>
<div id="dialog"><div class="name">ДЖОНСОН</div><div id="dialogText"></div></div>

<script src="three.min.js"></script>

<script>
/* ============================================================
   ИГРА — базовая сцена, вода, катер, остров, джойстик, камера
   (полный код из предыдущего ответа; здесь сохранён полностью)
   ============================================================ */
(function () {
'use strict';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.15, 8000);

const FOG_COLOR   = new THREE.Color(0.72, 0.84, 0.93);
const FOG_DENSITY = 0.0018;
scene.fog = new THREE.FogExp2(FOG_COLOR.getHex(), FOG_DENSITY);
const sunDir = new THREE.Vector3(0.45, 0.30, -0.84).normalize();

// Свет
const sunLight = new THREE.DirectionalLight(0xfff2dd, 1.55);
sunLight.position.copy(sunDir).multiplyScalar(120);
scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0xbfd8f0, 0x14303e, 0.85));
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

// Небо (шейдер)
const skyUniforms = { uSunDir: { value: sunDir }, uTime: { value: 0 } };
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
  vertexShader: `varying vec3 vDir;
    void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `
    uniform vec3 uSunDir; uniform float uTime; varying vec3 vDir;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
      float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.03;a*=.5;}return v;}
    void main(){
      vec3 dir=normalize(vDir); float y=dir.y;
      vec3 zen=vec3(.09,.28,.62),mid=vec3(.35,.60,.88),hor=vec3(.72,.84,.93);
      float t=clamp(y,0.,1.);
      vec3 sky=mix(hor,mid,smoothstep(0.,.28,t));
      sky=mix(sky,zen,smoothstep(.18,.92,t));
      sky=mix(sky,hor*.88,smoothstep(0.,-.20,y));
      float sd=max(dot(dir,uSunDir),0.);
      sky+=vec3(1.,.78,.50)*pow(sd,6.)*.38;
      sky+=vec3(1.,.88,.68)*pow(sd,120.)*1.10;
      sky+=vec3(1.,.97,.90)*smoothstep(.99955,.99985,sd)*4.;
      if(y>.004){
        vec2 cp=dir.xz/max(y,.075)*1.5+vec2(uTime*.0055,uTime*.0028);
        float n=fbm(cp*.75);
        float cl=smoothstep(.50,.86,n)*smoothstep(.015,.24,y);
        vec3 cc=mix(vec3(1.,.97,.94),vec3(1.,.86,.68),pow(sd,2.5));
        sky=mix(sky,cc,cl*.88);
      }
      gl_FragColor=vec4(sky,1.);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3200, 48, 32), skyMat);
sky.frustumCulled = false; scene.add(sky);

// Вода
const WATER_SIZE = 1600, WATER_SEG = 320, WATER_CELL = WATER_SIZE / WATER_SEG;
const waterGeo = new THREE.PlaneGeometry(WATER_SIZE, WATER_SIZE, WATER_SEG, WATER_SEG);
waterGeo.rotateX(-Math.PI / 2);
const WAVE_GLSL = `
  float waveH(vec2 p,float t){
    float h=0.;
    h+=0.55*sin(dot(p,vec2(0.7809,0.6247))*0.28+t*1.10);
    h+=0.34*sin(dot(p,vec2(-0.7071,0.7071))*0.35-t*0.90);
    h+=0.16*sin(dot(p,vec2(0.5145,-0.8575))*0.52+t*1.70);
    h+=0.07*sin(dot(p,vec2(-0.1961,-0.9806))*0.90-t*2.40);
    return h;
  }`;
const waterUniforms = {
  uTime: { value: 0 }, uSunDir: { value: sunDir },
  uCamPos: { value: new THREE.Vector3() },
  uFogColor: { value: FOG_COLOR }, uFogDensity: { value: FOG_DENSITY }
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms, fog: false,
  vertexShader: `uniform float uTime; varying vec3 vWorld; ${WAVE_GLSL}
    void main(){ vec4 wp=modelMatrix*vec4(position,1.0); wp.y+=waveH(wp.xz,uTime);
      vWorld=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uSunDir; uniform vec3 uCamPos;
    uniform vec3 uFogColor; uniform float uFogDensity; varying vec3 vWorld;
    ${WAVE_GLSL}
    vec2 waveGrad(vec2 p,float t){vec2 g=vec2(0.);vec2 d;float ph,a,f;
      d=vec2(0.7809,0.6247);f=.28;a=.55;ph=dot(d,p)*f+t*1.10;g+=a*f*cos(ph)*d;
      d=vec2(-0.7071,0.7071);f=.35;a=.34;ph=dot(d,p)*f-t*.90;g+=a*f*cos(ph)*d;
      d=vec2(0.5145,-0.8575);f=.52;a=.16;ph=dot(d,p)*f+t*1.70;g+=a*f*cos(ph)*d;
      d=vec2(-0.1961,-0.9806);f=.90;a=.07;ph=dot(d,p)*f-t*2.40;g+=a*f*cos(ph)*d;
      d=vec2(0.9239,0.3827);f=2.1;a=.017;ph=dot(d,p)*f+t*3.30;g+=a*f*cos(ph)*d;
      d=vec2(-0.3827,0.9239);f=2.9;a=.009;ph=dot(d,p)*f-t*4.10;g+=a*f*cos(ph)*d;
      d=vec2(0.6,-0.8);f=4.3;a=.005;ph=dot(d,p)*f+t*5.20;g+=a*f*cos(ph)*d;
      return g;}
    vec3 skyTone(vec3 d){float t=clamp(d.y,0.,1.);
      vec3 c=mix(vec3(.72,.84,.93),vec3(.35,.60,.88),smoothstep(0.,.40,t));
      c=mix(c,vec3(.09,.28,.62),smoothstep(.30,1.,t));
      float sd=max(dot(d,uSunDir),0.);
      c+=vec3(1.,.84,.58)*pow(sd,9.)*.45; return c;}
    void main(){
      vec2 p=vWorld.xz; float t=uTime;
      vec2 g=waveGrad(p,t); vec3 N=normalize(vec3(-g.x,1.,-g.y));
      vec3 V=normalize(uCamPos-vWorld);
      vec3 R=reflect(-V,N); R.y=abs(R.y);
      vec3 refl=skyTone(R);
      float fres=clamp(.02+.98*pow(1.-max(dot(N,V),0.),5.),0.,1.);
      vec3 deep=vec3(.012,.070,.115),shal=vec3(.055,.310,.420);
      vec3 base=mix(deep,shal,smoothstep(0.,.65,1.-max(dot(N,V),0.)));
      vec3 col=mix(base,refl,fres);
      col+=vec3(1.,.93,.80)*pow(max(dot(R,uSunDir),0.),320.)*2.6;
      col+=vec3(1.,.82,.58)*pow(max(dot(R,uSunDir),0.),14.)*.16*fres;
      col+=vec3(.06,.30,.32)*pow(max(dot(V,-uSunDir),0.),4.)*.45*(1.-fres);
      float h=waveH(p,t);
      col=mix(col,vec3(.86,.93,.99),smoothstep(.88,1.18,h)*.32);
      float dist=length(uCamPos-vWorld);
      float f=1.-exp(-pow(dist*uFogDensity,2.));
      col=mix(col,uFogColor,clamp(f,0.,1.));
      gl_FragColor=vec4(col,1.);
    }`
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.frustumCulled = false; scene.add(water);

// Волны для JS
function waveHeight(x, z, t) {
  let h = 0;
  h += 0.55 * Math.sin(( 0.7809 * x + 0.6247 * z) * 0.28 + t * 1.10);
  h += 0.34 * Math.sin((-0.7071 * x + 0.7071 * z) * 0.35 - t * 0.90);
  h += 0.16 * Math.sin(( 0.5145 * x - 0.8575 * z) * 0.52 + t * 1.70);
  h += 0.07 * Math.sin((-0.1961 * x - 0.9806 * z) * 0.90 - t * 2.40);
  return h;
}

// Остров + причалы (портирован без изменений)
const ISLAND_POS = new THREE.Vector3(60, 0, 320);
const islandRot  = Math.atan2(-ISLAND_POS.x, -ISLAND_POS.z);
const portDir    = new THREE.Vector3(Math.sin(islandRot), 0, Math.cos(islandRot));
const islandGroup = new THREE.Group();
islandGroup.position.copy(ISLAND_POS);
islandGroup.rotation.y = islandRot;
scene.add(islandGroup);

(function buildIsland(){
  const R_SAND=56, R_GRASS=52;
  const matSand=new THREE.MeshStandardMaterial({color:0xe6d5a8,roughness:1});
  const matGrass=new THREE.MeshStandardMaterial({color:0x5c8a4a,roughness:.95});
  const matWood=new THREE.MeshStandardMaterial({color:0x8a6a45,roughness:.85});
  const matDark=new THREE.MeshStandardMaterial({color:0x2c3540,roughness:.75});
  const matWhite=new THREE.MeshStandardMaterial({color:0xf0f0ec,roughness:.6});
  const matRed=new THREE.MeshStandardMaterial({color:0xc0392b,roughness:.7});
  const matConc=new THREE.MeshStandardMaterial({color:0x9a9a94,roughness:.9});

  const sand=new THREE.Mesh(new THREE.SphereGeometry(R_SAND,48,28),matSand);
  sand.scale.set(1,.28,1); sand.position.y=-6; islandGroup.add(sand);
  const grass=new THREE.Mesh(new THREE.SphereGeometry(R_GRASS,44,24),matGrass);
  grass.scale.set(1,.34,1); grass.position.y=-4.5; islandGroup.add(grass);

  const grassY=d=>-4.5+.34*Math.sqrt(Math.max(0,R_GRASS*R_GRASS-d*d));
  const sandY=d=>-6+.28*Math.sqrt(Math.max(0,R_SAND*R_SAND-d*d));

  const trunkGeo=new THREE.CylinderGeometry(.35,.5,3.2,6);
  const leafGeo=new THREE.ConeGeometry(2.6,6.5,7);
  const trunkMat=new THREE.MeshStandardMaterial({color:0x5b4228,roughness:1});
  const leafMat=new THREE.MeshStandardMaterial({color:0x2f6b32,roughness:1});
  let placed=0,tries=0;
  while(placed<32 && tries<400){tries++;
    const a=Math.random()*Math.PI*2, r=8+Math.random()*32;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(z>16) continue;
    if(Math.abs(x+24)<10 && Math.abs(z-8)<10) continue;
    const y=Math.max(grassY(r),sandY(r));
    const t=new THREE.Group();
    const tr=new THREE.Mesh(trunkGeo,trunkMat); tr.position.y=1.6;
    const lv=new THREE.Mesh(leafGeo,leafMat); lv.position.y=5.4;
    t.add(tr,lv); t.scale.setScalar(.7+Math.random()*.7);
    t.position.set(x,y-.3,z); t.rotation.y=Math.random()*Math.PI*2;
    islandGroup.add(t); placed++;
  }

  // Главный причал
  const pier=new THREE.Group(); islandGroup.add(pier);
  const deck=new THREE.Mesh(new THREE.BoxGeometry(11,.9,88),matWood);
  deck.position.set(0,2.5,78); pier.add(deck);
  const railL=new THREE.Mesh(new THREE.BoxGeometry(.4,.9,88),matConc);
  railL.position.set(-5.3,3.2,78);
  const railR=railL.clone(); railR.position.x=5.3; pier.add(railL,railR);
  const pileGeo=new THREE.CylinderGeometry(.5,.5,7,8);
  for(let z=36;z<=120;z+=11){
    for(let k=-1;k<=1;k+=2){
      const p=new THREE.Mesh(pileGeo,matDark); p.position.set(k*4.4,-1,z); pier.add(p);
    }
  }

  // Малый причал (сюда приходит Джонсон)
  const small=new THREE.Group(); islandGroup.add(small);
  const sdeck=new THREE.Mesh(new THREE.BoxGeometry(5,.6,36),matWood);
  sdeck.position.set(30,1.6,60); small.add(sdeck);
  for(let z=46;z<=76;z+=7.5){
    for(let k=-1;k<=1;k+=2){
      const p=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,6,7),matDark);
      p.position.set(30+k*1.8,-1.2,z); small.add(p);
    }
  }

  // Маяк
  const lhx=-24,lhz=8;
  const lhd=Math.hypot(lhx,lhz);
  const lhy=Math.max(grassY(lhd),sandY(lhd));
  const lh=new THREE.Group(); lh.position.set(lhx,lhy-.6,lhz);
  const tower=new THREE.Mesh(new THREE.CylinderGeometry(1.7,2.6,13,14),matWhite);
  tower.position.y=6.5;
  const b1=new THREE.Mesh(new THREE.CylinderGeometry(1.88,2.06,1.3,14),matRed);
  b1.position.y=4.6;
  const b2=new THREE.Mesh(new THREE.CylinderGeometry(1.72,1.78,1.2,14),matRed);
  b2.position.y=9.6;
  const gal=new THREE.Mesh(new THREE.CylinderGeometry(2.9,2.9,.5,14),matDark);
  gal.position.y=13.2;
  const lampMat=new THREE.MeshStandardMaterial({color:0xffe9a8,emissive:0xffcc55,emissiveIntensity:1.6,roughness:.3});
  const lr=new THREE.Mesh(new THREE.CylinderGeometry(1.65,1.65,2.3,12),lampMat);
  lr.position.y=14.6;
  const rf=new THREE.Mesh(new THREE.ConeGeometry(2.05,2.1,14),matRed);
  rf.position.y=16.8;
  lh.add(tower,b1,b2,gal,lr,rf); islandGroup.add(lh);
})();

// Катер (упрощённый, но узнаваемый)
function buildBoat(){
  const boat=new THREE.Group(); boat.rotation.order='YXZ';
  const matHull=new THREE.MeshStandardMaterial({color:0xf7f8f9,roughness:.28,metalness:.1});
  const matLower=new THREE.MeshStandardMaterial({color:0x17324e,roughness:.32,metalness:.18});
  const matStripe=new THREE.MeshStandardMaterial({color:0xc0392b,roughness:.45});
  const matTeak=new THREE.MeshStandardMaterial({color:0xbb8d55,roughness:.82});
  const matWhite=new THREE.MeshStandardMaterial({color:0xeef1f4,roughness:.38});
  const matGlass=new THREE.MeshStandardMaterial({color:0x14222e,roughness:.05,metalness:.88,transparent:true,opacity:.86});
  const matDark=new THREE.MeshStandardMaterial({color:0x1e2a35,roughness:.55,metalness:.32});
  const matChrome=new THREE.MeshStandardMaterial({color:0xf2f6fa,roughness:.06,metalness:1});
  const matRed=new THREE.MeshStandardMaterial({color:0xff2a2a,emissive:0xaa0000,emissiveIntensity:.7});
  const matGreen=new THREE.MeshStandardMaterial({color:0x2aff2a,emissive:0x00aa00,emissiveIntensity:.7});
  const matSeat=new THREE.MeshStandardMaterial({color:0xf0ead8,roughness:.76});
  const matSeatD=new THREE.MeshStandardMaterial({color:0x2c4258,roughness:.7});
  const matMotor=new THREE.MeshStandardMaterial({color:0x1e242c,roughness:.32,metalness:.6});

  const s=new THREE.Shape();
  s.moveTo(0,2.85);
  s.bezierCurveTo(.98,1.98,1.38,.25,1.34,-1.45);
  s.bezierCurveTo(1.3,-2.08,1.1,-2.5,1.05,-2.65);
  s.lineTo(-1.05,-2.65);
  s.bezierCurveTo(-1.1,-2.5,-1.3,-2.08,-1.34,-1.45);
  s.bezierCurveTo(-1.38,.25,-.98,1.98,0,2.85);
  const hg=new THREE.ExtrudeGeometry(s,{depth:.88,bevelEnabled:true,bevelThickness:.22,bevelSize:.22,bevelSegments:5,curveSegments:26,steps:1});
  hg.rotateX(Math.PI/2); hg.translate(0,.44,0);
  boat.add(new THREE.Mesh(hg,matHull));

  const s2=new THREE.Shape();
  s2.moveTo(0,2.4);
  s2.bezierCurveTo(.82,1.6,1.16,.15,1.12,-1.35);
  s2.lineTo(-1.12,-1.35);
  s2.bezierCurveTo(-1.16,.15,-.82,1.6,0,2.4);
  const lg=new THREE.ExtrudeGeometry(s2,{depth:.34,bevelEnabled:true,bevelThickness:.1,bevelSize:.1,bevelSegments:3,curveSegments:22,steps:1});
  lg.rotateX(Math.PI/2); lg.translate(0,.06,0);
  boat.add(new THREE.Mesh(lg,matLower));

  const stripe=new THREE.Mesh(new THREE.TorusGeometry(1.22,.055,6,48),matStripe);
  stripe.rotation.x=Math.PI/2; stripe.scale.set(.94,1.9,1); stripe.position.set(0,.58,.05);
  boat.add(stripe);

  const dShape=new THREE.Shape();
  dShape.moveTo(0,2.5);
  dShape.bezierCurveTo(.78,1.55,.98,.1,.93,-1.35);
  dShape.lineTo(.88,-2.18); dShape.lineTo(-.88,-2.18); dShape.lineTo(-.93,-1.35);
  dShape.bezierCurveTo(-.98,.1,-.78,1.55,0,2.5);
  const dGeo=new THREE.ShapeGeometry(dShape,26); dGeo.rotateX(-Math.PI/2);
  const deck=new THREE.Mesh(dGeo,matTeak); deck.position.y=.7; boat.add(deck);

  const rub=new THREE.Mesh(new THREE.TorusGeometry(1.26,.06,5,48),matDark);
  rub.rotation.x=Math.PI/2; rub.scale.set(.99,1.98,1); rub.position.set(0,.75,.05);
  boat.add(rub);

  const cb=new THREE.Mesh(new THREE.BoxGeometry(1.42,.76,1.68),matWhite);
  cb.position.set(0,1.08,-.35); boat.add(cb);
  const dash=new THREE.Mesh(new THREE.BoxGeometry(1.36,.14,1.58),matDark);
  dash.position.set(0,1.47,-.35); boat.add(dash);

  const ws=new THREE.Mesh(new THREE.BoxGeometry(1.3,.6,.05),matGlass);
  ws.position.set(0,1.62,.42); ws.rotation.x=-.5; boat.add(ws);
  const wsTop=new THREE.Mesh(new THREE.BoxGeometry(1.36,.07,.07),matChrome);
  wsTop.position.set(0,1.87,.58); boat.add(wsTop);

  // Сиденья
  function makeSeat(x,z){
    const g=new THREE.Group();
    const ped=new THREE.Mesh(new THREE.CylinderGeometry(.09,.11,.58,12),matChrome); ped.position.y=.54;
    const base=new THREE.Mesh(new THREE.BoxGeometry(.66,.22,.66),matSeatD); base.position.y=.9;
    const cush=new THREE.Mesh(new THREE.BoxGeometry(.64,.18,.64),matSeat); cush.position.y=1.1;
    const back=new THREE.Mesh(new THREE.BoxGeometry(.64,.76,.16),matSeat);
    back.position.set(0,1.42,-.28); back.rotation.x=.18;
    g.add(ped,base,cush,back); g.position.set(x,0,z); return g;
  }
  boat.add(makeSeat(-.47,-1.42));
  boat.add(makeSeat(.47,-1.42));

  const bench=new THREE.Mesh(new THREE.BoxGeometry(2.1,.38,.6),matSeat);
  bench.position.set(0,.92,-2.1); boat.add(bench);
  const bb=new THREE.Mesh(new THREE.BoxGeometry(2.1,.54,.14),matSeat);
  bb.position.set(0,1.24,-2.42); bb.rotation.x=-.1; boat.add(bb);

  const pad=new THREE.Mesh(new THREE.BoxGeometry(1.6,.14,1.3),matSeat);
  pad.position.set(0,.81,1.42); boat.add(pad);

  const navR=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),matRed);
  navR.position.set(-.68,.98,1.8); boat.add(navR);
  const navG=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),matGreen);
  navG.position.set(.68,.98,1.8); boat.add(navG);

  const mb=new THREE.Mesh(new THREE.BoxGeometry(.62,.82,.5),matMotor);
  mb.position.set(0,.9,-2.9); boat.add(mb);
  const mt=new THREE.Mesh(new THREE.BoxGeometry(.56,.22,.44),matMotor);
  mt.position.set(0,1.4,-2.84); boat.add(mt);

  return boat;
}
const boat = buildBoat(); scene.add(boat);

// Частицы
const MAX_P=800;
const pPos=new Float32Array(MAX_P*3), pSize=new Float32Array(MAX_P), pAlpha=new Float32Array(MAX_P);
const pVel=new Float32Array(MAX_P*3), pLife=new Float32Array(MAX_P), pMaxLife=new Float32Array(MAX_P);
const pType=new Uint8Array(MAX_P);
let pCursor=0;
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('size',new THREE.BufferAttribute(pSize,1));
pGeo.setAttribute('alpha',new THREE.BufferAttribute(pAlpha,1));
function makeSoftTex(){
  const c=document.createElement('canvas'); c.width=64;c.height=64;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.4,'rgba(255,255,255,.55)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; return t;
}
const pMat=new THREE.ShaderMaterial({
  uniforms:{uTex:{value:makeSoftTex()}},
  vertexShader:`attribute float size;attribute float alpha;varying float vA;
    void main(){vA=alpha;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*(340./max(-mv.z,.1));gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D uTex;varying float vA;
    void main(){if(vA<.01)discard;vec4 t=texture2D(uTex,gl_PointCoord);gl_FragColor=vec4(1.,1.,1.,t.a*vA);}`,
  transparent:true,depthWrite:false
});
const pPoints=new THREE.Points(pGeo,pMat); pPoints.frustumCulled=false; scene.add(pPoints);

function spawnP(x,y,z,vx,vy,vz,sz,lf,tp){
  const i=pCursor; pCursor=(pCursor+1)%MAX_P;
  pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
  pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
  pSize[i]=sz;pLife[i]=lf;pMaxLife[i]=lf;
  pAlpha[i]=tp===0?.55:1;pType[i]=tp;
}
function updateP(dt,time){
  for(let i=0;i<MAX_P;i++){
    if(pLife[i]<=0) continue;
    pLife[i]-=dt;
    if(pLife[i]<=0){pAlpha[i]=0;pSize[i]=0;continue;}
    const t=pLife[i]/pMaxLife[i], ix=i*3;
    if(pType[i]===1){
      pVel[ix+1]-=9.8*dt;
      pPos[ix]+=pVel[ix]*dt; pPos[ix+1]+=pVel[ix+1]*dt; pPos[ix+2]+=pVel[ix+2]*dt;
      const wh=waveHeight(pPos[ix],pPos[ix+2],time);
      if(pPos[ix+1]<wh){pAlpha[i]=0;pSize[i]=0;pLife[i]=0;continue;}
      pVel[ix]*=Math.pow(.35,dt); pVel[ix+2]*=Math.pow(.35,dt);
      pAlpha[i]=t*t; pSize[i]+=dt*.6;
    } else {
      pPos[ix]+=pVel[ix]*dt; pPos[ix+2]+=pVel[ix+2]*dt;
      pPos[ix+1]=waveHeight(pPos[ix],pPos[ix+2],time)+.18;
      pVel[ix]*=Math.pow(.15,dt); pVel[ix+2]*=Math.pow(.15,dt);
      pAlpha[i]=t*t*.7; pSize[i]+=dt*1.8;
    }
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.size.needsUpdate=true;
  pGeo.attributes.alpha.needsUpdate=true;
}

// Джойстик
const joyEl=document.getElementById('joy'), knobEl=document.getElementById('knob');
let jx=0,jy=0,joyActive=false;
function joyMove(e){
  const r=joyEl.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const maxR=r.width*.33, dist=Math.hypot(dx,dy);
  if(dist>maxR){dx=dx/dist*maxR;dy=dy/dist*maxR;}
  knobEl.style.transform='translate('+dx+'px,'+dy+'px)';
  jx=-dx/maxR; jy=-dy/maxR;
}
function joyReset(){joyActive=false;knobEl.style.transform='translate(0,0)';jx=0;jy=0;}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joyActive=true;
  if(joyEl.setPointerCapture){try{joyEl.setPointerCapture(e.pointerId);}catch(err){}}
  joyMove(e);});
joyEl.addEventListener('pointermove',e=>{if(!joyActive)return;e.preventDefault();joyMove(e);});
joyEl.addEventListener('pointerup',e=>{e.preventDefault();joyReset();});
joyEl.addEventListener('pointercancel',e=>{e.preventDefault();joyReset();});
joyEl.addEventListener('lostpointercapture',()=>joyReset());

setTimeout(()=>{const h=document.getElementById('hint');if(h){h.style.opacity='0';setTimeout(()=>h.style.display='none',1600);}},6400);

// Камера — вращение пальцем, вид от капитана
let firstPerson=false, fpYaw=0, fpPitch=0;
const exitHint=document.getElementById('exitFP');
const dragging={active:false};
let lastPX=0,lastPY=0,userOffset=0,camHeightAdj=0,lastDragTime=-10;
let downX=0,downY=0,downT=0,moved=false,lastTap=0;
const raycaster=new THREE.Raycaster();
const mouseNDC=new THREE.Vector2();
const el=renderer.domElement;

function setFP(on){
  firstPerson=on; fpYaw=0; fpPitch=0;
  if(on) exitHint.classList.add('show');
  else {exitHint.classList.remove('show'); userOffset=0; camHeightAdj=0;}
}
function handleDoubleTap(e){
  if(firstPerson){setFP(false);return;}
  mouseNDC.x=(e.clientX/window.innerWidth)*2-1;
  mouseNDC.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouseNDC,camera);
  const hits=raycaster.intersectObject(boat,true);
  if(hits.length>0) setFP(true);
}
el.addEventListener('pointerdown',e=>{
  downX=e.clientX;downY=e.clientY;downT=performance.now();moved=false;
  dragging.active=true; lastPX=e.clientX; lastPY=e.clientY;
  if(el.setPointerCapture){try{el.setPointerCapture(e.pointerId);}catch(err){}}
});
el.addEventListener('pointermove',e=>{
  if(!dragging.active) return;
  const dx=e.clientX-lastPX, dy=e.clientY-lastPY;
  lastPX=e.clientX; lastPY=e.clientY;
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>8) moved=true;
  if(firstPerson){
    fpYaw-=dx*.0045; fpPitch-=dy*.0045;
    fpPitch=Math.max(-.7,Math.min(.7,fpPitch));
  } else {
    userOffset-=dx*.006;
    camHeightAdj-=dy*.022;
    camHeightAdj=Math.max(-3.5,Math.min(11,camHeightAdj));
  }
  lastDragTime=time;
});
function endDrag(e){
  if(!dragging.active) return;
  dragging.active=false;
  const dur=performance.now()-downT;
  if(!moved && dur<320 && e && e.clientX!==undefined){
    const now=performance.now();
    if(now-lastTap<420){handleDoubleTap(e);lastTap=0;}
    else lastTap=now;
  }
}
el.addEventListener('pointerup',endDrag);
el.addEventListener('pointercancel',()=>{dragging.active=false;});
el.addEventListener('lostpointercapture',()=>{dragging.active=false;});

// Физика
const boatPos=new THREE.Vector3(0,0,0);
let heading=0, speed=0;
const MAX_SPEED=15, MAX_REVERSE=-4.5;
const camTarget=new THREE.Vector3(), camDesired=new THREE.Vector3();
let camAngle=Math.PI;
let wakeAccum=0, splashAccum=0;

function lerpAngle(a,b,t){
  let d=b-a;
  d=((d+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
  return a+d*t;
}

// Миникарта
const mapCanvas=document.getElementById('map');
const mctx=mapCanvas.getContext('2d');
const MAP_W=320,MAP_H=320,MAP_CX=MAP_W/2,MAP_CY=MAP_H/2,MAP_R=MAP_W/2-6;
const MAP_RANGE=900, MAP_S=MAP_W/MAP_RANGE;
function w2mx(x){return MAP_CX+(x-boatPos.x)*MAP_S;}
function w2my(z){return MAP_CY-(z-boatPos.z)*MAP_S;}
function drawMap(){
  mctx.clearRect(0,0,MAP_W,MAP_H);
  mctx.save(); mctx.beginPath(); mctx.arc(MAP_CX,MAP_CY,MAP_R,0,Math.PI*2);
  mctx.fillStyle='rgba(8,24,40,.42)'; mctx.fill(); mctx.clip();
  mctx.strokeStyle='rgba(255,255,255,.1)'; mctx.lineWidth=1;
  const half=MAP_RANGE/2;
  const gx0=Math.floor((boatPos.x-half)/100)*100;
  const gz0=Math.floor((boatPos.z-half)/100)*100;
  for(let gx=gx0;gx<=boatPos.x+half;gx+=100){
    const px=w2mx(gx); mctx.beginPath(); mctx.moveTo(px,0); mctx.lineTo(px,MAP_H); mctx.stroke();
  }
  for(let gz=gz0;gz<=boatPos.z+half;gz+=100){
    const py=w2my(gz); mctx.beginPath(); mctx.moveTo(0,py); mctx.lineTo(MAP_W,py); mctx.stroke();
  }
  const ix=w2mx(ISLAND_POS.x), iy=w2my(ISLAND_POS.z);
  if(Math.hypot(ix-MAP_CX,iy-MAP_CY)<MAP_R+60){
    mctx.fillStyle='rgba(232,216,168,.8)';
    mctx.beginPath(); mctx.arc(ix,iy,58*MAP_S,0,Math.PI*2); mctx.fill();
    mctx.fillStyle='rgba(92,138,74,.92)';
    mctx.beginPath(); mctx.arc(ix,iy,50*MAP_S,0,Math.PI*2); mctx.fill();
  }
  // Джонсон на карте (звёздочка)
  if(window.johnsonMarker){
    const jx_=w2mx(window.johnsonMarker.x), jy_=w2my(window.johnsonMarker.z);
    if(Math.hypot(jx_-MAP_CX,jy_-MAP_CY)<MAP_R){
      mctx.fillStyle='#ff5566';
      mctx.beginPath(); mctx.arc(jx_,jy_,4,0,Math.PI*2); mctx.fill();
      mctx.strokeStyle='#fff'; mctx.lineWidth=1.5; mctx.stroke();
    }
  }
  mctx.lineCap='round';
  mctx.strokeStyle='rgba(205,180,140,.95)'; mctx.lineWidth=3.5;
  mctx.beginPath();
  mctx.moveTo(w2mx(ISLAND_POS.x+portDir.x*34), w2my(ISLAND_POS.z+portDir.z*34));
  mctx.lineTo(w2mx(ISLAND_POS.x+portDir.x*122), w2my(ISLAND_POS.z+portDir.z*122));
  mctx.stroke();
  mctx.save();
  mctx.translate(MAP_CX,MAP_CY); mctx.rotate(heading);
  mctx.beginPath();
  mctx.moveTo(0,-10); mctx.lineTo(6.5,8); mctx.lineTo(0,4.5); mctx.lineTo(-6.5,8);
  mctx.closePath();
  mctx.fillStyle='#ffd166'; mctx.fill();
  mctx.strokeStyle='rgba(0,0,0,.65)'; mctx.lineWidth=1.6; mctx.stroke();
  mctx.restore();
  mctx.restore();
  mctx.beginPath(); mctx.arc(MAP_CX,MAP_CY,MAP_R,0,Math.PI*2);
  mctx.strokeStyle='rgba(180,220,255,.55)'; mctx.lineWidth=3; mctx.stroke();
  mctx.fillStyle='rgba(225,240,255,.95)';
  mctx.font='bold 17px system-ui'; mctx.textAlign='center'; mctx.textBaseline='middle';
  mctx.fillText('N',MAP_CX,17);
}

// Цикл
const clock=new THREE.Clock();
let time=0;
const fpOff=new THREE.Vector3(), fpDir=new THREE.Vector3(), fpTgt=new THREE.Vector3();
const fpQ=new THREE.Quaternion(), YAX=new THREE.Vector3(0,1,0);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  time+=dt;

  const throttle=Math.max(-1,Math.min(1,jy));
  const targetSpeed=throttle>=0?throttle*MAX_SPEED:throttle*Math.abs(MAX_REVERSE);
  speed+=(targetSpeed-speed)*Math.min(1,dt*1.6);
  const turnRate=jx*1.35*(.35+Math.min(Math.abs(speed)/MAX_SPEED,1)*.9);
  heading+=turnRate*dt;
  boatPos.x+=Math.sin(heading)*speed*dt;
  boatPos.z+=Math.cos(heading)*speed*dt;

  const hC=waveHeight(boatPos.x,boatPos.z,time);
  const fx=Math.sin(heading), fz=Math.cos(heading);
  const rx=Math.cos(heading), rz=-Math.sin(heading);
  const hF=waveHeight(boatPos.x+fx*2.4,boatPos.z+fz*2.4,time);
  const hB=waveHeight(boatPos.x-fx*2.4,boatPos.z-fz*2.4,time);
  const hR=waveHeight(boatPos.x+rx*1.2,boatPos.z+rz*1.2,time);
  const hL=waveHeight(boatPos.x-rx*1.2,boatPos.z-rz*1.2,time);
  const pitch=Math.atan2(hB-hF,4.8)+Math.max(0,speed)*.012;
  const roll=Math.atan2(hR-hL,2.4)+jx*.06;
  boat.position.set(boatPos.x,hC+.15,boatPos.z);
  boat.rotation.y=heading; boat.rotation.x=pitch; boat.rotation.z=roll;
  boat.updateMatrixWorld(true);

  // Джонсон
  if(window.johnsonTick){
    window.johnsonTick(dt, time, boatPos, heading, speed, islandGroup);
  }

  // Частицы
  const absSpeed=Math.abs(speed);
  if(absSpeed>.5){
    const rate=Math.min(absSpeed*14,100);
    wakeAccum+=rate*dt; let s=0;
    while(wakeAccum>=1 && s<40){
      s++; wakeAccum-=1;
      const side=(Math.random()-.5)*1.9;
      const px=boatPos.x-fx*2.3+rx*side;
      const pz=boatPos.z-fz*2.3+rz*side;
      const wh=waveHeight(px,pz,time);
      const out=Math.sign(side)*(.35+Math.random()*.55)*Math.min(absSpeed*.16,1.6);
      spawnP(px,wh+.18,pz, rx*out+(Math.random()-.5)*.35, 0, rz*out+(Math.random()-.5)*.35,
             1.6+Math.random()*1.8, 1.6+Math.random()*1.2, 0);
    }
  } else wakeAccum=0;
  if(absSpeed>3 && speed>0){
    const rate=(absSpeed-3)*16;
    splashAccum+=rate*dt; let s=0;
    while(splashAccum>=1 && s<40){
      s++; splashAccum-=1;
      const side=(Math.random()-.5)*2.2;
      const px=boatPos.x+fx*2.45+rx*side;
      const pz=boatPos.z+fz*2.45+rz*side;
      const wh=waveHeight(px,pz,time);
      spawnP(px,wh+.35,pz,
        fx*absSpeed*.14+rx*(Math.random()-.5)*3,
        1.6+Math.random()*3.8,
        fz*absSpeed*.14+rz*(Math.random()-.5)*3,
        1.2+Math.random()*1.1, .65+Math.random()*.65, 1);
    }
  } else splashAccum=0;
  updateP(dt,time);

  water.position.set(
    Math.round(boatPos.x/WATER_CELL)*WATER_CELL, 0,
    Math.round(boatPos.z/WATER_CELL)*WATER_CELL
  );
  waterUniforms.uTime.value=time;
  waterUniforms.uCamPos.value.copy(camera.position);
  sky.position.copy(camera.position);
  skyUniforms.uTime.value=time;

  if(firstPerson){
    fpOff.set(0,1.72,-1.05).applyQuaternion(boat.quaternion);
    camera.position.copy(boat.position).add(fpOff);
    fpQ.setFromAxisAngle(YAX,fpYaw);
    fpDir.set(0,0,1).applyQuaternion(fpQ).applyQuaternion(boat.quaternion);
    fpDir.y+=fpPitch*1.2; fpDir.normalize();
    fpTgt.copy(camera.position).add(fpDir);
    camera.lookAt(fpTgt);
    mapCanvas.style.opacity='.15';
  } else {
    mapCanvas.style.opacity='1';
    const idle=time-lastDragTime;
    if(!dragging.active && idle>3 && Math.abs(speed)<1.5) userOffset+=dt*.16;
    if(!dragging.active && Math.abs(speed)>2 && idle>1.2) userOffset*=Math.pow(.3,dt);
    const targetAngle=heading+Math.PI+userOffset;
    camAngle=lerpAngle(camAngle,targetAngle,1-Math.pow(.004,dt));
    const dist=16+Math.min(Math.abs(speed)*.38,5.5);
    const height=6.6+camHeightAdj+Math.min(Math.abs(speed)*.06,1.8);
    camTarget.set(boatPos.x,boat.position.y+1.25,boatPos.z);
    camDesired.set(
      camTarget.x+Math.sin(camAngle)*dist,
      camTarget.y+height,
      camTarget.z+Math.cos(camAngle)*dist
    );
    camera.position.lerp(camDesired,1-Math.pow(.0015,dt));
    const cw=waveHeight(camera.position.x,camera.position.z,time)+1.8;
    if(camera.position.y<cw) camera.position.y=cw;
    camera.lookAt(camTarget);
  }

  drawMap();
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

camera.position.set(0,8,-16); camera.lookAt(0,1,0);

// Экспорт для johnson.js
window.GAME = {
  scene, camera, islandGroup, boat,
  boatPos,
  getTime: () => time,
  waveHeight,
  // Для карты — маркер Джонсона
  johnsonMarker: null
};

// PWA
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

animate();
})();
</script>
