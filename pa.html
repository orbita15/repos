<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ночная парковка — VK Видео на большом экране</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: Arial, Helvetica, sans-serif; width: 100%; height: 100%; }

        #webglCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: block; }
        #css3dLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        #info { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px; pointer-events: none; z-index: 100; font-size: 13px; white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }
        #playHint { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.85); padding: 12px 22px; border-radius: 8px; z-index: 100; font-size: 15px; cursor: pointer; transition: opacity 0.5s; border: 2px solid #4dff9a; box-shadow: 0 0 20px rgba(77, 255, 154, 0.5); text-align: center; max-width: 90vw; }
        #playHint.hidden { opacity: 0; pointer-events: none; }

        #menuToggle { position: absolute; top: 20px; left: 20px; z-index: 200; width: 48px; height: 48px; border-radius: 8px; background: rgba(0,0,0,0.8); color: #fff; border: 2px solid #555; font-size: 22px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; transition: all 0.2s; padding: 0; }
        #menuToggle:hover, #menuToggle:active { background: #333; border-color: #888; }

        #channelMenu { position: absolute; top: 0; left: 0; bottom: 0; width: min(320px, 85vw); background: rgba(10, 14, 24, 0.97); border-right: 2px solid #2a7; z-index: 190; transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; box-shadow: 4px 0 30px rgba(0,0,0,0.8); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
        #channelMenu.open { transform: translateX(0); }

        #menuHeader { padding: 16px 20px; border-bottom: 2px solid #2a7; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        #menuHeader h2 { margin: 0; color: #4dff9a; font-size: 17px; font-weight: bold; letter-spacing: 0.5px; }
        #menuClose { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
        #menuClose:hover { color: #fff; background: rgba(255,255,255,0.1); }

        #channelList { flex: 1; overflow-y: auto; padding: 8px 0; -webkit-overflow-scrolling: touch; }
        #channelList::-webkit-scrollbar { width: 6px; }
        #channelList::-webkit-scrollbar-track { background: transparent; }
        #channelList::-webkit-scrollbar-thumb { background: #2a7; border-radius: 3px; }

        .channelGroup { padding: 10px 20px 6px; color: #7ec8ff; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; opacity: 0.7; }

        .channelItem { display: flex; align-items: center; gap: 10px; padding: 11px 20px; cursor: pointer; color: #c8d0dc; font-size: 14px; transition: background 0.15s; border-left: 3px solid transparent; }
        .channelItem:hover, .channelItem:active { background: rgba(120, 200, 255, 0.08); }
        .channelItem.active { background: rgba(77, 255, 154, 0.12); border-left-color: #4dff9a; color: #fff; font-weight: bold; }
        .channelItem.ok .statusDot { background: #4dff9a; box-shadow: 0 0 8px #4dff9a; }
        .channelItem.fail .statusDot { background: #ff5b5b; box-shadow: 0 0 8px #ff5b5b; }
        .channelItem.loading .statusDot { background: #ffd24d; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .statusDot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; transition: all 0.3s; }
        .channelName { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .channelType { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); color: #8fa0b5; font-family: monospace; flex-shrink: 0; }

        #soundBtn { position: absolute; top: 20px; right: 20px; z-index: 100; width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #555; font-size: 22px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; transition: all 0.2s; padding: 0; }
        #soundBtn:hover, #soundBtn:active { background: #333; border-color: #888; }
        #soundBtn.on { border-color: #4dff9a; color: #4dff9a; box-shadow: 0 0 15px rgba(77,255,154,0.5); }
        #soundBtn.off { border-color: #a33; color: #ff5b5b; }

        #volumeWrap { position: absolute; top: 78px; right: 20px; z-index: 100; background: rgba(0,0,0,0.85); padding: 10px 12px; border-radius: 10px; display: none; align-items: center; gap: 8px; color: #fff; border: 1px solid #444; font-size: 12px; }
        #volumeWrap.show { display: flex; }
        #volumeSlider { width: 110px; cursor: pointer; accent-color: #4dff9a; }

        #streamVideo { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }

        #menuOverlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 180; opacity: 0; pointer-events: none; transition: opacity 0.35s; }
        #menuOverlay.show { opacity: 1; pointer-events: auto; }

        #joystick { position: absolute; bottom: 24px; left: 24px; z-index: 250; display: none; touch-action: none; user-select: none; -webkit-user-select: none; }
        @media (pointer: coarse) { #joystick { display: block; } }
        #joystickBase { width: 120px; height: 120px; border-radius: 50%; background: rgba(0, 0, 0, 0.45); border: 2px solid rgba(77, 255, 154, 0.55); position: relative; box-shadow: 0 0 20px rgba(77, 255, 154, 0.35); touch-action: none; }
        #joystickKnob { width: 52px; height: 52px; border-radius: 50%; background: rgba(77, 255, 154, 0.85); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(77, 255, 154, 0.7); pointer-events: none; }
        #moveHint { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0, 0, 0, 0.75); padding: 8px 16px; border-radius: 8px; font-size: 12px; z-index: 100; pointer-events: none; transition: opacity 0.6s; white-space: nowrap; border: 1px solid rgba(77, 255, 154, 0.4); }
        #moveHint.hidden { opacity: 0; }
        @media (pointer: coarse) { #moveHint { display: none; } }

        #netHud { position: absolute; top: 20px; right: 80px; z-index: 100; color: #fff; background: rgba(0,0,0,0.65); padding: 6px 12px; border-radius: 8px; font-size: 12px; pointer-events: none; border: 1px solid rgba(77,255,154,0.35); font-family: monospace; }
        #netHud.off { border-color: rgba(255,91,91,0.45); color: #ff8b8b; }

        @media (max-width: 600px) {
            #info { top: 20px; left: 78px; right: 130px; transform: none; font-size: 11px; padding: 6px 10px; max-width: none; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            #menuToggle { width: 44px; height: 44px; font-size: 20px; top: 18px; left: 14px; }
            #soundBtn { width: 44px; height: 44px; font-size: 20px; top: 18px; right: 14px; }
            #volumeWrap { top: 72px; right: 14px; }
            #volumeSlider { width: 90px; }
            #playHint { font-size: 13px; padding: 10px 16px; bottom: 30px; }
            .channelItem { padding: 12px 16px; font-size: 15px; }
            .channelGroup { padding: 10px 16px 4px; }
            #netHud { top: 72px; right: 14px; font-size: 11px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            #info { display: none; }
            #menuToggle { width: 40px; height: 40px; font-size: 18px; top: 10px; left: 10px; }
            #soundBtn { width: 40px; height: 40px; font-size: 18px; top: 10px; right: 10px; }
            #channelMenu { width: min(300px, 50vw); }
            #playHint { bottom: 15px; font-size: 12px; padding: 8px 14px; }
            #netHud { top: 10px; right: 60px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="info">🎥 VK Видео — Уличный кинотеатр</div>
    <div id="playHint">▶ Нажмите на экран, чтобы запустить видео</div>

    <button id="menuToggle">☰</button>
    <div id="menuOverlay"></div>

    <div id="channelMenu">
        <div id="menuHeader">
            <h2>📺 КАНАЛЫ</h2>
            <button id="menuClose">✕</button>
        </div>
        <div id="channelList"></div>
    </div>

    <button id="soundBtn" class="off" title="Включить звук">🔇</button>

    <div id="volumeWrap">
        <span>🔊</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
        <span id="volumeVal">70%</span>
    </div>

    <div id="netHud">👥 0</div>

    <div id="joystick">
        <div id="joystickBase">
            <div id="joystickKnob"></div>
        </div>
    </div>
    <div id="moveHint">WASD / стрелки — ходить</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

    <video id="streamVideo" playsinline loop preload="auto"></video>

    <script>
        // ============================================================
        // 1. СЦЕНА
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.017);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(14, 7, 26);
        camera.lookAt(0, 4, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.domElement.id = 'webglCanvas';
        document.body.appendChild(renderer.domElement);

        const cssRenderer = new THREE.CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.domElement.id = 'css3dLayer';
        document.body.appendChild(cssRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.5, 15);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minPolarAngle = 0.25;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 4;
        controls.maxDistance = 45;

        // ============================================================
        // 2. СВЕТ
        // ============================================================
        scene.add(new THREE.AmbientLight(0x303045, 0.5));

        const moonLight = new THREE.DirectionalLight(0x8899bb, 0.5);
        moonLight.position.set(-15, 25, -10);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048;
        moonLight.shadow.mapSize.height = 2048;
        moonLight.shadow.camera.left   = -50;
        moonLight.shadow.camera.right  =  50;
        moonLight.shadow.camera.top    =  50;
        moonLight.shadow.camera.bottom = -50;
        scene.add(moonLight);

        const screenGlow = new THREE.PointLight(0xffaa55, 1.2, 40, 2);
        screenGlow.position.set(0, 6, 5);
        scene.add(screenGlow);

        const spotLight = new THREE.SpotLight(0xffdd88, 1.5);
        spotLight.position.set(8, 12, 10);
        spotLight.target.position.set(0, 0, 0);
        spotLight.angle = Math.PI / 5;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        scene.add(spotLight);
        scene.add(spotLight.target);

        // ============================================================
        // 3. ЗЕМЛЯ
        // ============================================================
        const groundCanvas = document.createElement('canvas');
        groundCanvas.width = 1024;
        groundCanvas.height = 1024;
        const gctx = groundCanvas.getContext('2d');

        const groundGrad = gctx.createRadialGradient(512, 512, 60, 512, 512, 480);
        groundGrad.addColorStop(0.00, '#1e1e28');
        groundGrad.addColorStop(0.20, '#15151e');
        groundGrad.addColorStop(0.40, '#0e0e18');
        groundGrad.addColorStop(0.58, '#09090f');
        groundGrad.addColorStop(0.72, '#050510');
        groundGrad.addColorStop(0.85, '#050510');
        groundGrad.addColorStop(1.00, '#050510');

        gctx.fillStyle = groundGrad;
        gctx.fillRect(0, 0, 1024, 1024);

        gctx.fillStyle = 'rgba(255,255,255,0.010)';
        for (let i = 0; i < 3500; i++) {
            gctx.fillRect(Math.random() * 1024, Math.random() * 1024, 1, 1);
        }

        const groundTexture = new THREE.CanvasTexture(groundCanvas);
        groundTexture.encoding = THREE.sRGBEncoding;
        groundTexture.minFilter = THREE.LinearFilter;
        groundTexture.magFilter = THREE.LinearFilter;
        groundTexture.generateMipmaps = false;

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(140, 140),
            new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 1.0, metalness: 0.0, color: 0xffffff })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const lineMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
        for (let i = -3; i <= 3; i++) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.01, 12), lineMaterial);
            line.position.set(i * 5, 0.02, 0);
            line.receiveShadow = true;
            scene.add(line);
        }

        // ============================================================
        // 4. ЭКРАН + КАРКАС
        // ============================================================
        const screenWidth = 16;
        const screenHeight = 9;

        const screenBacking = new THREE.Mesh(
            new THREE.PlaneGeometry(screenWidth, screenHeight),
            new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.FrontSide })
        );
        screenBacking.position.set(0, 5.5, 0.95);
        scene.add(screenBacking);

        const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6, metalness: 0.8 });

        const topBar = new THREE.Mesh(new THREE.BoxGeometry(screenWidth + 1, 0.4, 0.4), frameMaterial);
        topBar.position.set(0, 5.5 + screenHeight / 2 + 0.2, 1.3);
        topBar.castShadow = true; scene.add(topBar);

        const bottomBar = new THREE.Mesh(new THREE.BoxGeometry(screenWidth + 1, 0.4, 0.4), frameMaterial);
        bottomBar.position.set(0, 5.5 - screenHeight / 2 - 0.2, 1.3);
        bottomBar.castShadow = true; scene.add(bottomBar);

        const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 8, 8), frameMaterial);
        leftPost.position.set(-screenWidth / 2 - 0.7, 4, 1.3);
        leftPost.castShadow = true; scene.add(leftPost);

        const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 8, 8), frameMaterial);
        rightPost.position.set(screenWidth / 2 + 0.7, 4, 1.3);
        rightPost.castShadow = true; scene.add(rightPost);

        // ============================================================
        // 5. ИНФО-CANVAS
        // ============================================================
        const infoCanvas = document.createElement('canvas');
        infoCanvas.width = 1280;
        infoCanvas.height = 720;
        const ictx = infoCanvas.getContext('2d');

        const infoTexture = new THREE.CanvasTexture(infoCanvas);
        infoTexture.minFilter = THREE.LinearFilter;
        infoTexture.magFilter = THREE.LinearFilter;
        infoTexture.encoding = THREE.sRGBEncoding;

        // ============================================================
        // 6. ВИДЕО + ЗВУК
        // ============================================================
        const videoElement = document.getElementById('streamVideo');
        videoElement.playsInline = true;
        videoElement.loop = true;
        videoElement.volume = 0.7;

        const soundBtn    = document.getElementById('soundBtn');
        const volumeWrap  = document.getElementById('volumeWrap');
        const volumeSlider= document.getElementById('volumeSlider');
        const volumeVal   = document.getElementById('volumeVal');

        let soundEnabled = false;
        let userInteracted = false;

        function updateSoundBtn() {
            if (soundEnabled) {
                soundBtn.textContent = '🔊';
                soundBtn.classList.remove('off');
                soundBtn.classList.add('on');
                soundBtn.title = 'Выключить звук';
            } else {
                soundBtn.textContent = '🔇';
                soundBtn.classList.remove('on');
                soundBtn.classList.add('off');
                soundBtn.title = 'Включить звук';
            }
        }

        function enableSound() {
            soundEnabled = true;
            videoElement.muted = false;
            videoElement.volume = parseFloat(volumeSlider.value);
            videoElement.play().catch(() => {});
            updateSoundBtn();
        }

        function disableSound() {
            soundEnabled = false;
            videoElement.muted = true;
            updateSoundBtn();
        }

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userInteracted = true;
            if (soundEnabled) {
                disableSound();
                volumeWrap.classList.remove('show');
            } else {
                enableSound();
                volumeWrap.classList.add('show');
            }
        });

        volumeSlider.addEventListener('input', () => {
            const v = parseFloat(volumeSlider.value);
            videoElement.volume = v;
            volumeVal.textContent = Math.round(v * 100) + '%';
            if (v > 0 && !soundEnabled) enableSound();
            if (v === 0) videoElement.muted = true;
            else if (soundEnabled) videoElement.muted = false;
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') {
                if (soundEnabled) disableSound();
                else enableSound();
            }
        });

        updateSoundBtn();

        // ============================================================
        // 7. ТЕКСТУРЫ
        // ============================================================
        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.format = THREE.RGBAFormat;
        videoTexture.generateMipmaps = false;
        videoTexture.encoding = THREE.sRGBEncoding;

        const screenMaterial = new THREE.MeshBasicMaterial({
            map: infoTexture,
            side: THREE.FrontSide,
            toneMapped: false
        });

        const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(screenWidth, screenHeight), screenMaterial);
        screenMesh.position.set(0, 5.5, 1.05);
        scene.add(screenMesh);

        // ============================================================
        // 8. СОСТОЯНИЕ UI
        // ============================================================
        const uiState = {
            title: 'УЛИЧНЫЙ КИНОТЕАТР',
            statusLine: 'Запуск…',
            currentName: '—',
            currentStatus: 'waiting',
            sources: [],
            log: [],
            spinner: 0,
            mode: 'info'
        };

        function pushLog(text) {
            const time = new Date().toLocaleTimeString('ru-RU');
            uiState.log.unshift(`[${time}] ${text}`);
            if (uiState.log.length > 6) uiState.log.pop();
            console.log(text);
        }

        function statusColor(s) {
            switch (s) {
                case 'ready':   return '#4dff9a';
                case 'playing': return '#4dff9a';
                case 'loading': return '#ffd24d';
                case 'failed':  return '#ff5b5b';
                default:        return '#8fa0b5';
            }
        }
        function statusLabel(s) {
            switch (s) {
                case 'ready':   return 'ГОТОВ';
                case 'playing': return 'ИГРАЕТ';
                case 'loading': return 'ЗАГРУЗКА…';
                case 'failed':  return 'ОШИБКА';
                default:        return 'ОЖИДАНИЕ';
            }
        }

        function drawInfoPanel(t) {
            const W = infoCanvas.width;
            const H = infoCanvas.height;

            const grad = ictx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0b1020');
            grad.addColorStop(1, '#050810');
            ictx.fillStyle = grad;
            ictx.fillRect(0, 0, W, H);

            ictx.fillStyle = 'rgba(255,255,255,0.025)';
            for (let y = 0; y < H; y += 4) ictx.fillRect(0, y, W, 2);

            ictx.strokeStyle = 'rgba(120,200,255,0.3)';
            ictx.lineWidth = 4;
            ictx.strokeRect(20, 20, W - 40, H - 40);

            ictx.fillStyle = '#7ec8ff';
            ictx.font = 'bold 48px Arial';
            ictx.textAlign = 'center';
            ictx.textBaseline = 'top';
            ictx.fillText('🎬  ' + uiState.title, W / 2, 50);

            ictx.strokeStyle = 'rgba(120,200,255,0.5)';
            ictx.lineWidth = 2;
            ictx.beginPath();
            ictx.moveTo(60, 125);
            ictx.lineTo(W - 60, 125);
            ictx.stroke();

            ictx.textAlign = 'left';
            ictx.font = 'bold 36px Arial';
            ictx.fillStyle = soundEnabled ? '#4dff9a' : '#ff5b5b';
            ictx.fillText(soundEnabled ? '🔊' : '🔇', 70, 145);
            ictx.fillStyle = '#aab6c8';
            ictx.font = '20px Arial';
            ictx.fillText(soundEnabled ? 'ЗВУК ВКЛ' : 'ЗВУК ВЫКЛ', 120, 152);

            ictx.fillStyle = '#aab6c8';
            ictx.font = '26px Arial';
            ictx.fillText('ТЕКУЩИЙ КАНАЛ:', 70, 195);

            ictx.fillStyle = '#ffffff';
            ictx.font = 'bold 42px Arial';
            ictx.fillText(uiState.currentName, 70, 235);

            const badgeColor = statusColor(uiState.currentStatus);
            ictx.fillStyle = badgeColor + '40';
            ictx.fillRect(W - 400, 215, 330, 60);
            ictx.strokeStyle = badgeColor;
            ictx.lineWidth = 4;
            ictx.strokeRect(W - 400, 215, 330, 60);
            ictx.fillStyle = badgeColor;
            ictx.font = 'bold 34px Arial';
            ictx.textAlign = 'center';
            ictx.fillText(statusLabel(uiState.currentStatus), W - 235, 230);

            if (uiState.currentStatus === 'loading') {
                const cx = W - 440;
                const cy = 245;
                ictx.strokeStyle = badgeColor;
                ictx.lineWidth = 6;
                ictx.beginPath();
                ictx.arc(cx, cy, 22, uiState.spinner, uiState.spinner + Math.PI * 1.4);
                ictx.stroke();
            }

            ictx.textAlign = 'left';
            ictx.fillStyle = '#d7e2f0';
            ictx.font = '28px Arial';
            ictx.fillText(uiState.statusLine, 70, 305);

            ictx.strokeStyle = 'rgba(120,200,255,0.25)';
            ictx.beginPath();
            ictx.moveTo(60, 355);
            ictx.lineTo(W - 60, 355);
            ictx.stroke();

            ictx.fillStyle = '#7ec8ff';

        let currentIframe     = null;
        let currentIframeObj  = null;

        const IFRAME_W = 1280;
        const IFRAME_H = 720;

        function createIframeObject(url) {
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.style.width  = IFRAME_W + 'px';
            iframe.style.height = IFRAME_H + 'px';
            iframe.style.border = 'none';
            iframe.style.background = '#000';
            iframe.style.pointerEvents = 'auto';
            iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write');
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('frameborder', '0');

            const obj = new THREE.CSS3DObject(iframe);
            obj.position.set(0, 5.5, 1.05);
            const scale = screenWidth / IFRAME_W;
            obj.scale.set(scale, scale, 1);
            return { obj, iframe };
        }

        function showIframe(url) {
            hideIframe();
            const { obj, iframe } = createIframeObject(url);
            currentIframeObj = obj;
            currentIframe = iframe;
            scene.add(obj);
            screenMesh.visible = false;
            uiState.mode = 'css3d';
            soundBtn.style.display = 'none';
            volumeWrap.classList.remove('show');
        }

        function hideIframe() {
            if (currentIframeObj) {
                scene.remove(currentIframeObj);
                if (currentIframe && currentIframe.parentNode) currentIframe.parentNode.removeChild(currentIframe);
                currentIframeObj = null;
                currentIframe = null;
            }
            screenMesh.visible = true;
            soundBtn.style.display = 'flex';
        }

        // ============================================================
        let currentHls = null;
        let currentIndex = 0;
        let sourceLoadTimeout = null;
        let isLoaded = false;
        let isPlayingVideo = false;
        let pendingHandlers = [];

        function detachPendingHandlers() {
            pendingHandlers.forEach(([ev, fn]) => videoElement.removeEventListener(ev, fn));
            pendingHandlers = [];
        }

        function clearVideoElement() {
            detachPendingHandlers();
            if (currentHls) { try { currentHls.destroy(); } catch (e) {} currentHls = null; }
            videoElement.pause();
            videoElement.removeAttribute('src');
            try { videoElement.load(); } catch (e) {}
        }

        function markSource(index, status) {
            if (uiState.sources[index]) uiState.sources[index].status = status;
            updateMenuStatus();
        }

        function showInfo() {
            uiState.mode = 'info';
            screenMaterial.map = infoTexture;
            screenMaterial.needsUpdate = true;
            screenMesh.visible = true;
        }
        function showVideo() {
            uiState.mode = 'video';
            screenMaterial.map = videoTexture;
            screenMaterial.needsUpdate = true;
            screenMesh.visible = true;
        }

        function tryPlay() {
            if (soundEnabled && userInteracted) videoElement.muted = false;
            else if (!userInteracted) videoElement.muted = true;

            const p = videoElement.play();
            if (p && p.catch) {
                p.catch(err => {
                    console.warn('play() failed:', err.name);
                    if (!videoElement.muted) {
                        videoElement.muted = true;
                        soundEnabled = false;
                        updateSoundBtn();
                        videoElement.play().catch(e2 => {
                            console.warn('play() muted also failed:', e2.name);
                            uiState.statusLine = 'Нажмите для запуска';
                            playHint.classList.remove('hidden');
                        });
                    } else {
                        uiState.statusLine = 'Нажмите для запуска';
                        playHint.classList.remove('hidden');
                    }
                });
            }
        }

        function loadSource(index) {
            if (sourceLoadTimeout) { clearTimeout(sourceLoadTimeout); sourceLoadTimeout = null; }

            if (index >= sources.length) {
                uiState.currentName = '—';
                uiState.currentStatus = 'failed';
                uiState.statusLine = 'Все каналы недоступны';
                pushLog('❌ Все каналы исчерпаны');
                isLoaded = false;
                isPlayingVideo = false;
                clearVideoElement();
                hideIframe();
                showInfo();
                updateMenuStatus();
                return;
            }

            isLoaded = false;
            isPlayingVideo = false;
            currentIndex = index;
            clearVideoElement();
            hideIframe();

            const source = sources[index];
            pushLog(`[${index + 1}/${sources.length}] Загрузка: ${source.name}`);

            uiState.currentName = source.name;
            uiState.currentStatus = 'loading';
            uiState.statusLine = `Подключение к каналу #${index + 1} из ${sources.length}…`;
            markSource(index, 'loading');
            updateMenuStatus();

            if (source.type === 'iframe') {
                showInfo();
                setTimeout(() => {
                    showIframe(source.url);
                    uiState.currentStatus = 'playing';
                    uiState.statusLine = `▶ ${source.name}`;
                    markSource(index, 'ready');
                    pushLog(`▶ Загружено: ${source.name}`);
                    playHint.classList.remove('hidden');
                }, 300);
                return;
            }

            showInfo();

            const onReady = () => {
                if (isLoaded) return;
                isLoaded = true;
                if (sourceLoadTimeout) { clearTimeout(sourceLoadTimeout); sourceLoadTimeout = null; }
                detachPendingHandlers();
                pushLog(`✅ Данные получены: ${source.name}`);
                uiState.currentStatus = 'ready';
                uiState.statusLine = 'Канал готов, запускаю…';
                markSource(index, 'ready');
                tryPlay();
            };

            const onMeta = () => onReady();
            const onCanPlay = () => onReady();
            videoElement.addEventListener('loadedmetadata', onMeta);
            videoElement.addEventListener('canplay', onCanPlay);
            pendingHandlers.push(['loadedmetadata', onMeta], ['canplay', onCanPlay]);

            sourceLoadTimeout = setTimeout(() => {
                sourceLoadTimeout = null;
                if (!isLoaded) {
                    pushLog(`⏱ Таймаут: ${source.name}`);
                    markSource(index, 'failed');
                    loadSource(index + 1);
                }
            }, 36000);

            if (source.type === 'hls') {
                if (window.Hls && Hls.isSupported()) {
                    const hls = new Hls({
                        maxBufferLength: 20, maxMaxBufferLength: 40,
                        manifestLoadingTimeOut: 30000, manifestLoadingMaxRetry: 2,
                        levelLoadingTimeOut: 30000, levelLoadingMaxRetry: 2,
                        fragLoadingTimeOut: 60000, fragLoadingMaxRetry: 3,
                        enableWorker: true, lowLatencyMode: false
                    });
                    currentHls = hls;

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        pushLog('HLS: манифест разобран');
                        uiState.statusLine = 'Манифест разобран, буферизация…';
                    });

                    hls.on(Hls.Events.FRAG_LOADED, onReady);

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        console.warn(`HLS: ${data.type} / ${data.details} (fatal=${data.fatal})`);
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                pushLog('HLS: сетевая ошибка, переключаюсь');
                                markSource(index, 'failed');
                                loadSource(index + 1);
                            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                pushLog('HLS: ошибка медиа, пробую восстановить');
                                try { hls.recoverMediaError(); } catch (e) {
                                    markSource(index, 'failed');
                                    loadSource(index + 1);
                                }
                            } else {
                                pushLog('HLS: fatal ошибка');
                                markSource(index, 'failed');
                                loadSource(index + 1);
                            }
                        }
                    });

                    hls.loadSource(source.url);
                    hls.attachMedia(videoElement);
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = source.url;
                    videoElement.load();
                } else {
                    pushLog('HLS не поддерживается');
                    markSource(index, 'failed');
                    loadSource(index + 1);
                }
            }
        }

        videoElement.addEventListener('playing', () => {
            isPlayingVideo = true;
            playHint.classList.add('hidden');
            uiState.currentStatus = 'playing';
            uiState.statusLine = `▶ ${sources[currentIndex].name}`;
            pushLog(`▶ Играет: ${sources[currentIndex].name}${videoElement.muted ? ' (без звука)' : ''}`);

        videoElement.addEventListener('pause', () => {

        videoElement.addEventListener('waiting', () => { pushLog('Буферизация…'); });

        videoElement.addEventListener('error', () => {

        document.addEventListener('click', () => {

            [35,   8,  1.4, 'broad'], [32, 16,  1.2, 'fir'],
            [30,   24, 1.1, 'broad'], [28, 32,  1.3, 'fir'],
            [-22, 36, 1.2, 'broad'], [-12, 38, 1.0, 'fir'],
            [0,   40, 1.3, 'broad'], [12,  38, 1.1, 'fir'],
            [22,  36, 1.2, 'broad']
        ];

        treePositions.forEach(([x, z, s, type]) => {
            if (type === 'fir') scene.add(createFir(x, z, s));
            else scene.add(createTree(x, z, s));
        });

        const bushPositions = [
            [-22, -15, 1.0], [-15, -20, 0.9], [-7, -23, 1.1], [1, -26, 0.8],
            [10, -22, 1.0], [18, -19, 0.9], [26, -17, 1.1],
            [-27, -6, 1.0], [-28, 4, 0.9], [-27, 12, 1.1], [-26, 20, 1.0], [-25, 28, 0.9],
            [27, -6, 1.1], [28, 4, 1.0], [27, 12, 0.9], [26, 20, 1.1], [25, 28, 1.0],
            [-18, 34, 0.9], [-6, 36, 1.1], [6, 37, 1.0], [18, 34, 1.1]
        ];

        bushPositions.forEach(([x, z, s]) => {
            scene.add(createBush(x, z, s));
        });

        // ============================================================
        // 15. АДАПТАЦИЯ
        // ============================================================
        function resizeRenderer() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(w, h);
            cssRenderer.setSize(w, h);
        }

        window.addEventListener('resize', resizeRenderer);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeRenderer, 50);
            setTimeout(resizeRenderer, 150);
            setTimeout(resizeRenderer, 400);
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeRenderer);
            window.visualViewport.addEventListener('scroll', resizeRenderer);
        }

        let lastW = window.innerWidth;
        let lastH = window.innerHeight;

        // ============================================================
        // 16. ЧЕЛОВЕЧКИ
        // ============================================================
        const CHAR_COLORS = [
            0xff6b6b, 0x4ecdc4, 0xffd93d, 0x95e1d3,
            0xa06bff, 0xff9f43, 0x54a0ff, 0xee5a24,
            0x7bed9f, 0xff4757, 0x1e90ff, 0xffa502
        ];

        function randomCharColor() {
            return CHAR_COLORS[Math.floor(Math.random() * CHAR_COLORS.length)];
        }

        let myCharacter = null;
        let myWalkPhase = 0;
        let localOpacity = 0;
        const myColor = randomCharColor();
        const peers = {};

        // Хелпер: "капсула" из цилиндра + 2 сфер (замена CapsuleGeometry для r128)
        function makeCapsule(radius, length, radialSeg, mat) {
            const g = new THREE.Group();
            const cylH = length;
            const cyl = new THREE.Mesh(
                new THREE.CylinderGeometry(radius, radius, cylH, radialSeg),
                mat
            );
            cyl.castShadow = true;
            g.add(cyl);
            const sphereGeo = new THREE.SphereGeometry(radius, radialSeg, Math.max(6, Math.floor(radialSeg / 2)));
            const top = new THREE.Mesh(sphereGeo, mat);
            top.position.y =  cylH / 2;
            top.castShadow = true;
            g.add(top);
            const bot = new THREE.Mesh(sphereGeo, mat);
            bot.position.y = -cylH / 2;
            bot.castShadow = true;
            g.add(bot);
            return g;
        }

        function createCharacter(color) {
            const group = new THREE.Group();

            const bodyMat  = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.15 });
            const skinMat  = new THREE.MeshStandardMaterial({ color: 0xffd4a8, roughness: 0.85 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9 });
            const shoeMat  = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const eyeMat   = new THREE.MeshBasicMaterial({ color: 0x000000 });

            const torso = makeCapsule(0.32, 0.55, 12, bodyMat);
            torso.position.y = 1.3;
            group.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 20), skinMat);
            head.position.y = 2.1; head.castShadow = true; group.add(head);

            const eyeGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const lEye = new THREE.Mesh(eyeGeo, eyeMat);
            lEye.position.set(-0.1, 2.15, 0.24); group.add(lEye);
            const rEye = new THREE.Mesh(eyeGeo, eyeMat);
            rEye.position.set(0.1, 2.15, 0.24); group.add(rEye);

            const leftArmPivot = new THREE.Group();
            leftArmPivot.position.set(-0.42, 1.65, 0);
            const leftArm = makeCapsule(0.08, 0.5, 8, bodyMat);
            leftArm.position.y = -0.33;
            leftArmPivot.add(leftArm);
            group.add(leftArmPivot);

            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(0.42, 1.65, 0);
            const rightArm = makeCapsule(0.08, 0.5, 8, bodyMat);
            rightArm.position.y = -0.33;
            rightArmPivot.add(rightArm);
            group.add(rightArmPivot);

            const leftLegPivot = new THREE.Group();
            leftLegPivot.position.set(-0.15, 0.9, 0);
            const leftLeg = makeCapsule(0.1, 0.7, 8, pantsMat);
            leftLeg.position.y = -0.45;
            leftLegPivot.add(leftLeg);
            const leftShoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.1, 0.32), shoeMat);
            leftShoe.position.set(0, -0.85, 0.06);
            leftShoe.castShadow = true;
            leftLegPivot.add(leftShoe);
            group.add(leftLegPivot);

            const rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(0.15, 0.9, 0);
            const rightLeg = makeCapsule(0.1, 0.7, 8, pantsMat);
            rightLeg.position.y = -0.45;
            rightLegPivot.add(rightLeg);
            const rightShoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.1, 0.32), shoeMat);
            rightShoe.position.set(0, -0.85, 0.06);
            rightShoe.castShadow = true;
            rightLegPivot.add(rightShoe);
            group.add(rightLegPivot);

            group.userData.parts = {
                torso, head, leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot
            };
            group.userData.walkAmp = 0;
            return group;
        }

        function setCharacterOpacity(group, opacity) {
            group.traverse(obj => {
                if (obj.isMesh && obj.material) {
                    obj.material.transparent = true;
                    obj.material.opacity = opacity;
                }
            });
            group.visible = opacity > 0.01;
        }

        function animateWalk(group, phase, moving, dt) {
            const parts = group.userData.parts;
            if (!parts) return;
            const targetAmp = moving ? 1 : 0;
            group.userData.walkAmp += (targetAmp - group.userData.walkAmp) * Math.min(1, dt * 6);
            const amp = group.userData.walkAmp;
            const swing    = Math.sin(phase) * 0.7 * amp;
            const swingOpp = Math.sin(phase + Math.PI) * 0.7 * amp;
            parts.leftLegPivot.rotation.x  = swing;
            parts.rightLegPivot.rotation.x = swingOpp;
            parts.leftArmPivot.rotation.x  = swingOpp * 0.85;
            parts.rightArmPivot.rotation.x = swing * 0.85;
        }

        myCharacter = createCharacter(myColor);
        myCharacter.position.set(0, 0, 15);
        myCharacter.rotation.y = Math.PI;
        setCharacterOpacity(myCharacter, 0);
        scene.add(myCharacter);

        // ============================================================
        // 16.1. МУЛЬТИПЛЕЕР — BroadcastChannel + WebRTC (Trystero/MQTT)
        // ============================================================
        const netHud = document.getElementById('netHud');

        const myId = 'u-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);

        let bc = null;
        let room = null;
        let posAction = null;
        let joinAction = null;
        let leaveAction = null;
        let webrtcReady = false;

        function netSend(msg) {
            msg.from = myId;

            if (bc) {
                try { bc.postMessage(msg); } catch (e) {}
            }

            if (webrtcReady) {
                try {
                    if (msg.type === 'pos' && posAction) posAction.send(msg);
                    else if (msg.type === 'join' && joinAction) joinAction.send(msg);
                    else if (msg.type === 'leave' && leaveAction) leaveAction.send(msg);
                } catch (e) {}
            }
        }

        function netReceive(msg) {
            if (!msg || typeof msg !== 'object') return;
            if (msg.from === myId) return;

            if (msg.type === 'join') {
                if (!peers[msg.from]) {
                    spawnPeer(msg.from, msg.color, msg.x, msg.z);
                    pushLog(`👤 Подключился пользователь`);
                } else {
                    peers[msg.from].fading = false;
                    peers[msg.from].lastSeen = Date.now();
                    if (typeof msg.x === 'number') peers[msg.from].targetX = msg.x;
                    if (typeof msg.z === 'number') peers[msg.from].targetZ = msg.z;
                }
                if (myCharacter) {
                    netSend({
                        type: 'pos',
                        x: myCharacter.position.x,
                        z: myCharacter.position.z,
                        rot: myCharacter.rotation.y
                    });
                }
            }
            else if (msg.type === 'pos') {
                if (!peers[msg.from]) {
                    spawnPeer(msg.from, null, msg.x, msg.z);
                    pushLog(`👤 Обнаружен пользователь`);
                }
                const p = peers[msg.from];
                if (!p) return;
                p.lastSeen = Date.now();
                p.fading = false;
                p.targetX = msg.x;
                p.targetZ = msg.z;
                p.targetRot = msg.rot;
            }
            else if (msg.type === 'leave') {
                if (peers[msg.from]) peers[msg.from].fading = true;
            }

            updateNetHud();
        }

        function updateNetHud() {
            const n = Object.keys(peers).length;
            netHud.textContent = '👥 ' + n + (webrtcReady ? '' : ' · локально');
            netHud.classList.toggle('off', n === 0 && !webrtcReady);
        }

        // --- BroadcastChannel ---
        try {
            bc = new BroadcastChannel('cinema-parking-v3');
            bc.onmessage = (e) => netReceive(e.data);
            console.log('[MP] BroadcastChannel OK');
        } catch (e) {
            console.warn('[MP] BroadcastChannel недоступен:', e);
        }

        // --- WebRTC через Trystero (MQTT-стратегия, новый пакет) ---
        async function initMultiplayer() {
            try {
                pushLog('⏳ WebRTC подключение…');
                const mod = await import('https://esm.sh/@trystero-p2p/mqtt');
                const joinRoom = mod.joinRoom;

                room = joinRoom({
                    appId: 'cinema-parking-multiplayer-v4',
                    // STUN + публичный TURN (OpenRelay) для обхода NAT
                    rtcConfig: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'stun:global.stun.twilio.com:3478' },
                            {
                                urls: 'turn:openrelay.metered.ca:80',
                                username: 'openrelayproject',
                                credential: 'openrelayproject'
                            },
                            {
                                urls: 'turn:openrelay.metered.ca:443',
                                username: 'openrelayproject',
                                credential: 'openrelayproject'
                            },
                            {
                                urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                                username: 'openrelayproject',
                                credential: 'openrelayproject'
                            }
                        ]
                    }
                }, 'main');

                posAction   = room.makeAction('pos');
                joinAction  = room.makeAction('join');
                leaveAction = room.makeAction('leave');

                posAction.onMessage   = (data) => netReceive(data);
                joinAction.onMessage  = (data) => netReceive(data);
                leaveAction.onMessage = (data) => netReceive(data);

                room.onPeerJoin = (peerId) => {
                    console.log('[MP] peer join', peerId);
                    try {
                        if (myCharacter) {
                            const jmsg = {
                                type: 'join', from: myId, color: myColor,
                                x: myCharacter.position.x,
                                z: myCharacter.position.z
                            };
                            const pmsg = {
                                type: 'pos', from: myId,
                                x: myCharacter.position.x,
                                z: myCharacter.position.z,
                                rot: myCharacter.rotation.y
                            };
                            joinAction.send(jmsg, peerId);
                            posAction.send(pmsg, peerId);
                        }
                    } catch (e) {}
                };

                room.onPeerLeave = (peerId) => {
                    console.log('[MP] peer leave', peerId);
                };

                webrtcReady = true;
                pushLog('✅ WebRTC подключён');
                updateNetHud();
            } catch (err) {
                console.warn('[MP] Trystero error:', err);
                pushLog('⚠️ WebRTC недоступен (только локально)');
                updateNetHud();
            }
        }

        initMultiplayer();

        // --- Периодическая рассылка своей позиции (10 Гц) ---
        setInterval(() => {
            if (!myCharacter) return;
            netSend({
                type: 'pos',
                x: myCharacter.position.x,
                z: myCharacter.position.z,
                rot: myCharacter.rotation.y
            });
        }, 100);

        // --- Объявляем о себе через 500мс ---
        setTimeout(() => {
            if (!myCharacter) return;
            netSend({
                type: 'join',
                color: myColor,
                x: myCharacter.position.x,
                z: myCharacter.position.z
            });
            pushLog('📢 Я в эфире');
        }, 500);

        // --- Периодически повторяем join ---
        setInterval(() => {
            if (!myCharacter) return;
            netSend({
                type: 'join',
                color: myColor,
                x: myCharacter.position.x,
                z: myCharacter.position.z
            });
        }, 5000);

        // --- Таймаут для отвалившихся пиров ---
        setInterval(() => {
            const now = Date.now();
            let changed = false;
            for (const id in peers) {
                if (!peers[id].fading && now - peers[id].lastSeen > 5000) {
                    peers[id].fading = true;
                    changed = true;
                }
            }
            if (changed) updateNetHud();
        }, 1000);

        // --- Уход ---
        const leaveAll = () => {
            netSend({ type: 'leave' });
            if (room) try { room.leave(); } catch (e) {}
        };
        window.addEventListener('beforeunload', leaveAll);
        window.addEventListener('pagehide', leaveAll);

        function spawnPeer(id, color, x, z) {
            if (peers[id]) {
                peers[id].fading = false;
                peers[id].lastSeen = Date.now();
                if (typeof x === 'number' && typeof z === 'number') {
                    peers[id].targetX = x;
                    peers[id].targetZ = z;
                }
                return;
            }

            const c = createCharacter(color || randomCharColor());
            const px = (typeof x === 'number' && isFinite(x)) ? x : 0;
            const pz = (typeof z === 'number' && isFinite(z)) ? z : 15;
            c.position.set(px, 0, pz);
            setCharacterOpacity(c, 0);
            scene.add(c);

            peers[id] = {
                group: c,
                opacity: 0,
                fading: false,
                lastSeen: Date.now(),
                targetX: px,
                targetZ: pz,
                targetRot: 0,
                walkPhase: 0
            };
        }

        updateNetHud();

        // ============================================================
        // 16.2. УПРАВЛЕНИЕ
        // ============================================================
        const keys = {};
        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            keys[k] = true;
            if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
        });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        const joyInput = { x: 0, y: 0 };
        const joystickBase = document.getElementById('joystickBase');
        const joystickKnob = document.getElementById('joystickKnob');
        let joyActive = false;
        let joyCenter = { x: 0, y: 0 };

        if (joystickBase) {
            joystickBase.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                joyActive = true;
                try { joystickBase.setPointerCapture(e.pointerId); } catch (err) {}
                const rect = joystickBase.getBoundingClientRect();
                joyCenter.x = rect.left + rect.width / 2;
                joyCenter.y = rect.top + rect.height / 2;
                updateJoy(e.clientX, e.clientY);
            });
            joystickBase.addEventListener('pointermove', (e) => { if (joyActive) updateJoy(e.clientX, e.clientY); });
            const resetJoy = () => {
                joyActive = false; joyInput.x = 0; joyInput.y = 0;
                if (joystickKnob) joystickKnob.style.transform = 'translate(-50%, -50%)';
            };
            joystickBase.addEventListener('pointerup', resetJoy);
            joystickBase.addEventListener('pointercancel', resetJoy);
            joystickBase.addEventListener('lostpointercapture', resetJoy);
        }

        function updateJoy(cx, cy) {
            let dx = cx - joyCenter.x;
            let dy = cy - joyCenter.y;
            const max = 45;
            const d = Math.hypot(dx, dy);
            if (d > max) { dx = dx / d * max; dy = dy / d * max; }
            if (joystickKnob) {
                joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            }
            joyInput.x = dx / max;
            joyInput.y = dy / max;
        }

        function getInput() {
            let ix = 0, iy = 0;
            if (keys['w'] || keys['arrowup']    || keys['ц']) iy -= 1;
            if (keys['s'] || keys['arrowdown']  || keys['ы']) iy += 1;
            if (keys['a'] || keys['arrowleft']  || keys['ф']) ix -= 1;
            if (keys['d'] || keys['arrowright'] || keys['в']) ix += 1;
            ix += joyInput.x;
            iy += joyInput.y;
            const len = Math.hypot(ix, iy);
            if (len > 1) { ix /= len; iy /= len; }
            return { x: ix, y: iy };
        }

        // ============================================================
        // 16.3. ОБНОВЛЕНИЕ ПЕРСОНАЖЕЙ
        // ============================================================
        const MOVE_SPEED = 5.5;
        const BOUNDS = 32;

        function updateCharacters(dt) {
            if (myCharacter) {
                if (localOpacity < 1) {
                    localOpacity = Math.min(1, localOpacity + dt * 0.8);
                    setCharacterOpacity(myCharacter, localOpacity);
                }

                const input = getInput();

                const camForward = new THREE.Vector3();
                camera.getWorldDirection(camForward);
                camForward.y = 0;
                camForward.normalize();
                const camRight = new THREE.Vector3()
                    .crossVectors(camForward, new THREE.Vector3(0, 1, 0))
                    .normalize();

                const moveVec = new THREE.Vector3()
                    .addScaledVector(camForward, -input.y)
                    .addScaledVector(camRight, input.x);

                const mag = moveVec.length();
                const moving = mag > 0.05;

                if (moving) {
                    moveVec.normalize().multiplyScalar(MOVE_SPEED * dt);
                    myCharacter.position.x += moveVec.x;
                    myCharacter.position.z += moveVec.z;
                    myCharacter.position.x = Math.max(-BOUNDS, Math.min(BOUNDS, myCharacter.position.x));
                    myCharacter.position.z = Math.max(-BOUNDS, Math.min(BOUNDS, myCharacter.position.z));

                    const targetRot = Math.atan2(moveVec.x, moveVec.z);
                    let dRot = targetRot - myCharacter.rotation.y;
                    while (dRot >  Math.PI) dRot -= Math.PI * 2;
                    while (dRot < -Math.PI) dRot += Math.PI * 2;
                    myCharacter.rotation.y += dRot * Math.min(1, dt * 12);

                    myWalkPhase += dt * 14;
                }

                animateWalk(myCharacter, myWalkPhase, moving, dt);

                controls.target.x += (myCharacter.position.x - controls.target.x) * Math.min(1, dt * 4);
                controls.target.y += (1.4 - controls.target.y) * Math.min(1, dt * 4);
                controls.target.z += (myCharacter.position.z - controls.target.z) * Math.min(1, dt * 4);

                if (moving) {
                    const hint = document.getElementById('moveHint');
                    if (hint && !hint.classList.contains('hidden')) hint.classList.add('hidden');
                }
            }

            for (const id in peers) {
                const p = peers[id];
                const g = p.group;

                if (p.fading) {
                    p.opacity = Math.max(0, p.opacity - dt * 1.2);
                    if (p.opacity <= 0) {
                        scene.remove(g);
                        g.traverse(o => {
                            if (o.isMesh) {
                                if (o.geometry) o.geometry.dispose();
                                if (o.material) {
                                    const mats = Array.isArray(o.material) ? o.material : [o.material];
                                    mats.forEach(m => m.dispose());
                                }
                            }
                        });
                        delete peers[id];
                        updateNetHud();
                        continue;
                    }
                } else {
                    p.opacity = Math.min(1, p.opacity + dt * 0.8);
                }
                setCharacterOpacity(g, p.opacity);

                const lerp = Math.min(1, dt * 8);
                const dx = p.targetX - g.position.x;
                const dz = p.targetZ - g.position.z;
                g.position.x += dx * lerp;
                g.position.z += dz * lerp;

                let dRot = p.targetRot - g.rotation.y;
                while (dRot >  Math.PI) dRot -= Math.PI * 2;
                while (dRot < -Math.PI) dRot += Math.PI * 2;
                g.rotation.y += dRot * lerp;

                const speed = Math.hypot(dx, dz);
                const moving = speed > 0.05;
                if (moving) p.walkPhase += dt * 14;
                animateWalk(g, p.walkPhase, moving, dt);
            }
        }

        setTimeout(() => {
            const hint = document.getElementById('moveHint');
            if (hint) hint.classList.add('hidden');
        }, 8000);

        // ============================================================
        // 17. АНИМАЦИЯ
        // ============================================================
        let clockTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            clockTime += 0.016;

            const w = window.innerWidth;
            const h = window.innerHeight;
            if (w !== lastW || h !== lastH) {
                lastW = w; lastH = h;
                resizeRenderer();
            }

            if (uiState.mode === 'info') {
                uiState.spinner += 0.12;
                drawInfoPanel(clockTime);
                infoTexture.needsUpdate = true;
            }

            if (uiState.mode === 'video' && !videoElement.paused && videoElement.readyState >= 2) {
                videoTexture.needsUpdate = true;
            }

            updateCharacters(0.016);

            screenGlow.intensity = 1.0 + Math.sin(Date.now() * 0.002) * 0.15;
            controls.update();

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }
        animate();
    </script>
</body>
