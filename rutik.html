<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ночная парковка — Уличный кинотеатр</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: Arial, Helvetica, sans-serif; width: 100%; height: 100%; }

        #webglCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            display: block;
        }
        #css3dLayer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #info {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; background: rgba(0,0,0,0.6);
            padding: 8px 16px; border-radius: 8px; pointer-events: none;
            z-index: 100; font-size: 13px; white-space: nowrap;
            max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
        }
        #playHint {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            color: #fff; background: rgba(0,0,0,0.85); padding: 12px 22px;
            border-radius: 8px; z-index: 100; font-size: 15px;
            cursor: pointer; transition: opacity 0.5s; border: 2px solid #4dff9a;
            box-shadow: 0 0 20px rgba(77, 255, 154, 0.5);
            text-align: center; max-width: 90vw;
        }
        #playHint.hidden { opacity: 0; pointer-events: none; }

        #menuToggle {
            position: absolute; top: 20px; left: 20px; z-index: 200;
            width: 48px; height: 48px; border-radius: 8px;
            background: rgba(0,0,0,0.8); color: #fff; border: 2px solid #555;
            font-size: 22px; cursor: pointer; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; padding: 0;
        }
        #menuToggle:hover, #menuToggle:active { background: #333; border-color: #888; }

        #channelMenu {
            position: absolute; top: 0; left: 0; bottom: 0;
            width: min(320px, 85vw);
            background: rgba(10, 14, 24, 0.97); border-right: 2px solid #2a7;
            z-index: 190; transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
            box-shadow: 4px 0 30px rgba(0,0,0,0.8);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        #channelMenu.open { transform: translateX(0); }

        #menuHeader {
            padding: 16px 20px; border-bottom: 2px solid #2a7;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        #menuHeader h2 {
            margin: 0; color: #4dff9a; font-size: 17px;
            font-weight: bold; letter-spacing: 0.5px;
        }
        #menuClose {
            background: none; border: none; color: #888; font-size: 24px;
            cursor: pointer; padding: 0; width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
        }
        #menuClose:hover { color: #fff; background: rgba(255,255,255,0.1); }

        #channelList { flex: 1; overflow-y: auto; padding: 8px 0; -webkit-overflow-scrolling: touch; }
        #channelList::-webkit-scrollbar { width: 6px; }
        #channelList::-webkit-scrollbar-track { background: transparent; }
        #channelList::-webkit-scrollbar-thumb { background: #2a7; border-radius: 3px; }

        .channelGroup {
            padding: 10px 20px 6px;
            color: #7ec8ff;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .channelItem {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 20px; cursor: pointer; color: #c8d0dc;
            font-size: 14px; transition: background 0.15s;
            border-left: 3px solid transparent;
        }
        .channelItem:hover, .channelItem:active { background: rgba(120, 200, 255, 0.08); }
        .channelItem.active {
            background: rgba(77, 255, 154, 0.12);
            border-left-color: #4dff9a; color: #fff; font-weight: bold;
        }
        .channelItem.ok .statusDot { background: #4dff9a; box-shadow: 0 0 8px #4dff9a; }
        .channelItem.fail .statusDot { background: #ff5b5b; box-shadow: 0 0 8px #ff5b5b; }
        .channelItem.loading .statusDot { background: #ffd24d; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .statusDot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #555; flex-shrink: 0;
            transition: all 0.3s;
        }
        .channelName { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .channelType {
            font-size: 10px; padding: 2px 6px; border-radius: 4px;
            background: rgba(255,255,255,0.1); color: #8fa0b5;
            font-family: monospace; flex-shrink: 0;
        }

        #soundBtn {
            position: absolute; top: 20px; right: 20px; z-index: 100;
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #555;
            font-size: 22px; cursor: pointer; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; padding: 0;
        }
        #soundBtn:hover, #soundBtn:active { background: #333; border-color: #888; }
        #soundBtn.on { border-color: #4dff9a; color: #4dff9a; box-shadow: 0 0 15px rgba(77,255,154,0.5); }
        #soundBtn.off { border-color: #a33; color: #ff5b5b; }

        #videoControls {
            position: absolute; bottom: 80px; right: 20px; z-index: 300;
            display: none; flex-direction: column; gap: 8px;
            padding: 10px;
            background: rgba(0,0,0,0.85);
            border: 2px solid #4dff9a;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(77,255,154,0.35);
        }
        #videoControls.show { display: flex; }

        .vcRow { display: flex; gap: 8px; }

        .vcBtn {
            min-width: 52px; height: 48px; padding: 0 12px;
            border-radius: 8px;
            background: rgba(20, 30, 45, 0.95);
            color: #fff; border: 1px solid #444;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            white-space: nowrap; user-select: none;
        }
        .vcBtn:hover, .vcBtn:active { background: #2a3a55; border-color: #7ec8ff; color: #7ec8ff; }
        .vcBtn.primary { background: rgba(77, 255, 154, 0.18); border-color: #4dff9a; color: #4dff9a; }
        .vcBtn.primary:hover { background: rgba(77, 255, 154, 0.30); }
        .vcBtn.danger  { background: rgba(255, 91, 91, 0.18); border-color: #ff5b5b; color: #ff5b5b; }
        .vcBtn.danger:hover { background: rgba(255, 91, 91, 0.30); }

        .vcLabel {
            color: #8fa0b5; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.5px;
            text-align: center; padding: 2px 0;
        }

        #manageBtn {
            position: absolute; bottom: 20px; right: 20px; z-index: 300;
            padding: 12px 20px; border-radius: 10px;
            background: rgba(0,0,0,0.85); color: #4dff9a;
            border: 2px solid #4dff9a; cursor: pointer;
            font-size: 14px; font-weight: bold;
            display: none; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        #manageBtn:hover { background: rgba(77,255,154,0.15); }
        #manageBtn.active {
            color: #ff5b5b; border-color: #ff5b5b;
            background: rgba(255,91,91,0.15);
        }

        #volumeWrap {
            position: absolute; top: 78px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.85); padding: 10px 12px; border-radius: 10px;
            display: none; align-items: center; gap: 8px; color: #fff;
            border: 1px solid #444; font-size: 12px;
        }
        #volumeWrap.show { display: flex; }
        #volumeSlider { width: 110px; cursor: pointer; accent-color: #4dff9a; }

        #streamVideo {
            position: absolute; top: -9999px; left: -9999px;
            width: 1px; height: 1px; opacity: 0.01; pointer-events: none;
        }

        #menuOverlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 180; opacity: 0; pointer-events: none;
            transition: opacity 0.35s;
        }
        #menuOverlay.show { opacity: 1; pointer-events: auto; }

        @media (max-width: 600px) {
            #info {
                top: 20px; left: 78px; right: 78px;
                transform: none; font-size: 11px; padding: 6px 10px;
                max-width: none; text-align: center;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            }
            #menuToggle { width: 44px; height: 44px; font-size: 20px; top: 18px; left: 14px; }
            #soundBtn { width: 44px; height: 44px; font-size: 20px; top: 18px; right: 14px; }
            #volumeWrap { top: 72px; right: 14px; }
            #volumeSlider { width: 90px; }
            #playHint { font-size: 13px; padding: 10px 16px; bottom: 30px; }
            .channelItem { padding: 12px 16px; font-size: 15px; }
            .channelGroup { padding: 10px 16px 4px; }
            #manageBtn { bottom: 12px; right: 12px; padding: 10px 16px; font-size: 13px; }
            #videoControls { bottom: 72px; right: 12px; padding: 8px; gap: 6px; }
            .vcBtn { min-width: 44px; height: 42px; padding: 0 10px; font-size: 16px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            #info { display: none; }
            #menuToggle { width: 40px; height: 40px; font-size: 18px; top: 10px; left: 10px; }
            #soundBtn { width: 40px; height: 40px; font-size: 18px; top: 10px; right: 10px; }
            #channelMenu { width: min(300px, 50vw); }
            #playHint { bottom: 15px; font-size: 12px; padding: 8px 14px; }
            #manageBtn { bottom: 8px; right: 8px; padding: 8px 14px; font-size: 12px; }
            #videoControls { bottom: 56px; right: 8px; }
            .vcBtn { min-width: 40px; height: 38px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div id="info">🎥 Ночная парковка — Уличный кинотеатр</div>
    <div id="playHint">▶ НАЖМИТЕ, ЧТОБЫ ЗАПУСТИТЬ ВИДЕО СО ЗВУКОМ</div>

    <button id="menuToggle">☰</button>
    <div id="menuOverlay"></div>

    <div id="channelMenu">
        <div id="menuHeader">
            <h2>📺 КАНАЛЫ</h2>
            <button id="menuClose">✕</button>
        </div>
        <div id="channelList"></div>
    </div>

    <button id="soundBtn" class="off" title="Включить звук">🔇</button>
    <button id="manageBtn">🎮 УПРАВЛЯТЬ ВИДЕО</button>

    <div id="videoControls">
        <div class="vcLabel">Управление плеером</div>

        <div class="vcRow">
            <button class="vcBtn" id="vcPlay"      title="Play">▶️</button>
            <button class="vcBtn" id="vcPause"     title="Pause">⏸️</button>
            <button class="vcBtn" id="vcStop"      title="Stop">⏹️</button>
        </div>

        <div class="vcRow">
            <button class="vcBtn" id="vcBack10"    title="-10 сек">⏪ 10</button>
            <button class="vcBtn" id="vcFwd10"     title="+10 сек">10 ⏩</button>
        </div>

        <div class="vcRow">
            <button class="vcBtn" id="vcVolDown"   title="Тише">🔉</button>
            <button class="vcBtn" id="vcMute"      title="Mute">🔇</button>
            <button class="vcBtn" id="vcVolUp"     title="Громче">🔊</button>
        </div>

        <div class="vcRow">
            <button class="vcBtn primary" id="vcFullscreen" title="Fullscreen">⛶</button>
            <button class="vcBtn danger"  id="vcClose"      title="Закрыть управление">✕</button>
        </div>
    </div>

    <div id="volumeWrap">
        <span>🔊</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
        <span id="volumeVal">70%</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

    <video id="streamVideo" playsinline loop preload="auto"></video>

    <script src="scene.js"></script>

    <script>
    // ============================================================
    // ГЛАВНЫЙ СКРИПТ ПЛЕЕРА
    // Зависит от: THREE, PARKING_SCENE (scene.js), Hls
    // ============================================================
    (function () {
        'use strict';

        const S = window.PARKING_SCENE;
        if (!S) {
            console.error('scene.js не загружен!');
            return;
        }

        const {
            scene, camera, renderer, cssRenderer, controls,
            screenWidth, screenHeight, screenMesh, screenMaterial, screenGlow,
            resize: resizeScene
        } = S;

        // --------------------------------------------------------
        // ХОТКЕИ
        // --------------------------------------------------------
        const videoElement = document.getElementById('streamVideo');
        videoElement.playsInline = true;
        videoElement.loop = true;
        videoElement.volume = 0.7;

        const soundBtn      = document.getElementById('soundBtn');
        const volumeWrap    = document.getElementById('volumeWrap');
        const volumeSlider  = document.getElementById('volumeSlider');
        const volumeVal     = document.getElementById('volumeVal');
        const manageBtn     = document.getElementById('manageBtn');
        const videoControls = document.getElementById('videoControls');
        const playHint      = document.getElementById('playHint');

        // --------------------------------------------------------
        // ЗВУК (только для HLS-режима)
        // --------------------------------------------------------
        let soundEnabled = false;
        let userInteracted = false;

        function updateSoundBtn() {
            if (soundEnabled) {
                soundBtn.textContent = '🔊';
                soundBtn.classList.remove('off');
                soundBtn.classList.add('on');
                soundBtn.title = 'Выключить звук';
            } else {
                soundBtn.textContent = '🔇';
                soundBtn.classList.remove('on');
                soundBtn.classList.add('off');
                soundBtn.title = 'Включить звук';
            }
        }

        function enableSound() {
            soundEnabled = true;
            videoElement.muted = false;
            videoElement.volume = parseFloat(volumeSlider.value);
            videoElement.play().catch(() => {});
            updateSoundBtn();
        }

        function disableSound() {
            soundEnabled = false;
            videoElement.muted = true;
            updateSoundBtn();
        }

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userInteracted = true;
            if (soundEnabled) {
                disableSound();
                volumeWrap.classList.remove('show');
            } else {
                enableSound();
                volumeWrap.classList.add('show');
            }
        });

        volumeSlider.addEventListener('input', () => {
            const v = parseFloat(volumeSlider.value);
            videoElement.volume = v;
            volumeVal.textContent = Math.round(v * 100) + '%';
            if (v > 0 && !soundEnabled) enableSound();
            if (v === 0) videoElement.muted = true;
            else if (soundEnabled) videoElement.muted = false;
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') {
                if (soundEnabled) disableSound();
                else enableSound();
            }
        });

        updateSoundBtn();

        // --------------------------------------------------------
        // ТЕКСТУРЫ ЭКРАНА (устанавливаются в PARKING_SCENE)
        // --------------------------------------------------------
        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.format = THREE.RGBAFormat;
        videoTexture.generateMipmaps = false;
        videoTexture.encoding = THREE.sRGBEncoding;

        const infoCanvas = document.createElement('canvas');
        infoCanvas.width = 1280;
        infoCanvas.height = 720;
        const ictx = infoCanvas.getContext('2d');

        const infoTexture = new THREE.CanvasTexture(infoCanvas);
        infoTexture.minFilter = THREE.LinearFilter;
        infoTexture.magFilter = THREE.LinearFilter;
        infoTexture.encoding = THREE.sRGBEncoding;

        screenMaterial.map = infoTexture;
        screenMaterial.needsUpdate = true;

        // --------------------------------------------------------
        // СОСТОЯНИЕ UI
        // --------------------------------------------------------
        const uiState = {
            title: 'УЛИЧНЫЙ КИНОТЕАТР',
            statusLine: 'Запуск…',
            currentName: '—',
            currentStatus: 'waiting',
            sources: [],
            log: [],
            spinner: 0,
            mode: 'info'
        };

        function pushLog(text) {
            const time = new Date().toLocaleTimeString('ru-RU');
            uiState.log.unshift(`[${time}] ${text}`);
            if (uiState.log.length > 6) uiState.log.pop();
            console.log(text);
        }

        function statusColor(s) {
            switch (s) {
                case 'ready':   return '#4dff9a';
                case 'playing': return '#4dff9a';
                case 'loading': return '#ffd24d';
                case 'failed':  return '#ff5b5b';
                default:        return '#8fa0b5';
            }
        }
        function statusLabel(s) {
            switch (s) {
                case 'ready':   return 'ГОТОВ';
                case 'playing': return 'ИГРАЕТ';
                case 'loading': return 'ЗАГРУЗКА…';
                case 'failed':  return 'ОШИБКА';
                default:        return 'ОЖИДАНИЕ';
            }
        }

        // --------------------------------------------------------
        // ИНФО-ПАНЕЛЬ
        // --------------------------------------------------------
        function drawInfoPanel(t) {
            const W = infoCanvas.width;
            const H = infoCanvas.height;

            const grad = ictx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0b1020');
            grad.addColorStop(1, '#050810');
            ictx.fillStyle = grad;
            ictx.fillRect(0, 0, W, H);

            ictx.fillStyle = 'rgba(255,255,255,0.025)';
            for (let y = 0; y < H; y += 4) ictx.fillRect(0, y, W, 2);

            ictx.strokeStyle = 'rgba(120,200,255,0.3)';
            ictx.lineWidth = 4;
            ictx.strokeRect(20, 20, W - 40, H - 40);

            ictx.fillStyle = '#7ec8ff';
            ictx.font = 'bold 48px Arial';
            ictx.textAlign = 'center';
            ictx.textBaseline = 'top';
            ictx.fillText('🎬  ' + uiState.title, W / 2, 50);

            ictx.strokeStyle = 'rgba(120,200,255,0.5)';
            ictx.lineWidth = 2;
            ictx.beginPath();
            ictx.moveTo(60, 125);
            ictx.lineTo(W - 60, 125);
            ictx.stroke();

            ictx.textAlign = 'left';
            ictx.font = 'bold 36px Arial';
            ictx.fillStyle = soundEnabled ? '#4dff9a' : '#ff5b5b';
            ictx.fillText(soundEnabled ? '🔊' : '🔇', 70, 145);
            ictx.fillStyle = '#aab6c8';
            ictx.font = '20px Arial';
            ictx.fillText(soundEnabled ? 'ЗВУК ВКЛ' : 'ЗВУК ВЫКЛ', 120, 152);

            ictx.fillStyle = '#aab6c8';
            ictx.font = '26px Arial';
            ictx.fillText('ТЕКУЩИЙ КАНАЛ:', 70, 195);

            ictx.fillStyle = '#ffffff';
            ictx.font = 'bold 42px Arial';
            ictx.fillText(uiState.currentName, 70, 235);

            const badgeColor = statusColor(uiState.currentStatus);
            ictx.fillStyle = badgeColor + '40';
            ictx.fillRect(W - 400, 215, 330, 60);
            ictx.strokeStyle = badgeColor;
            ictx.lineWidth = 4;
            ictx.strokeRect(W - 400, 215, 330, 60);
            ictx.fillStyle = badgeColor;
            ictx.font = 'bold 34px Arial';
            ictx.textAlign = 'center';
            ictx.fillText(statusLabel(uiState.currentStatus), W - 235, 230);

            if (uiState.currentStatus === 'loading') {
                const cx = W - 440;
                const cy = 245;
                ictx.strokeStyle = badgeColor;
                ictx.lineWidth = 6;
                ictx.beginPath();
                ictx.arc(cx, cy, 22, uiState.spinner, uiState.spinner + Math.PI * 1.4);
                ictx.stroke();
            }

            ictx.textAlign = 'left';
            ictx.fillStyle = '#d7e2f0';
            ictx.font = '28px Arial';
            ictx.fillText(uiState.statusLine, 70, 305);

            ictx.strokeStyle = 'rgba(120,200,255,0.25)';
            ictx.beginPath();
            ictx.moveTo(60, 355);
            ictx.lineTo(W - 60, 355);
            ictx.stroke();

            ictx.fillStyle = '#7ec8ff';
            ictx.font = 'bold 24px Arial';
            ictx.fillText('СПИСОК КАНАЛОВ:', 70, 375);

            const cols = 2;
            const colW = (W - 140) / cols;
            const rowH = 38;
            const startY = 408;

            uiState.sources.forEach((s, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = 70 + col * colW;
                const y = startY + row * rowH;
                if (y > H - 220) return;

                const isCurrent = i === currentIndex;
                const c = statusColor(s.status);

                if (isCurrent) {
                    ictx.fillStyle = 'rgba(120,200,255,0.12)';
                    ictx.fillRect(x - 10, y - 5, colW - 20, rowH - 6);
                }

                ictx.beginPath();
                ictx.fillStyle = c;
                ictx.arc(x + 10, y + 11, 6, 0, Math.PI * 2);
                ictx.fill();

                ictx.fillStyle = isCurrent ? '#ffffff' : '#aab6c8';
                ictx.font = (isCurrent ? 'bold ' : '') + '19px Arial';
                ictx.fillText(s.name, x + 28, y);

                ictx.fillStyle = c;
                ictx.font = '15px Arial';
                ictx.textAlign = 'right';
                ictx.fillText(statusLabel(s.status), x + colW - 30, y + 2);
                ictx.textAlign = 'left';
            });

            const logTop = H - 165;
            ictx.strokeStyle = 'rgba(120,200,255,0.25)';
            ictx.beginPath();
            ictx.moveTo(60, logTop - 15);
            ictx.lineTo(W - 60, logTop - 15);
            ictx.stroke();

            ictx.fillStyle = '#7ec8ff';
            ictx.font = 'bold 22px Arial';
            ictx.fillText('ЖУРНАЛ СОБЫТИЙ:', 70, logTop - 5);

            ictx.font = '17px monospace';
            uiState.log.forEach((line, i) => {
                ictx.fillStyle = i === 0 ? '#e6f3ff' : `rgba(200,220,240,${0.85 - i * 0.12})`;
                ictx.fillText(line, 70, logTop + 22 + i * 22);
            });

            const barX = ((t * 220) % (W + 300)) - 150;
            const barGrad = ictx.createLinearGradient(barX - 150, 0, barX + 150, 0);
            barGrad.addColorStop(0, 'rgba(120,200,255,0)');
            barGrad.addColorStop(0.5, 'rgba(120,200,255,0.12)');
            barGrad.addColorStop(1, 'rgba(120,200,255,0)');
            ictx.fillStyle = barGrad;
            ictx.fillRect(0, 0, W, H);

            ictx.fillStyle = 'rgba(200,220,240,0.7)';
            ictx.font = '20px monospace';
            ictx.textAlign = 'right';
            ictx.fillText(new Date().toLocaleTimeString('ru-RU'), W - 60, H - 55);
            ictx.textAlign = 'left';
        }

        // --------------------------------------------------------
        // ЗАГРУЗКА КАНАЛОВ ИЗ sources.json
        // --------------------------------------------------------
        const playHintEl = playHint;
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const channelMenu = document.getElementById('channelMenu');
        const channelList = document.getElementById('channelList');
        const menuOverlay = document.getElementById('menuOverlay');

        let sources = [];
        let iframeCount = 0;
        let rusCount = 0;
        let currentIndex = 0;

        async function loadSourcesFromFile() {
            try {
                const resp = await fetch('sources.json', { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();

                const flat = [];
                (data.groups || []).forEach(g => {
                    (g.items || []).forEach(it => {
                        flat.push({ group: g.title, type: it.type, url: it.url, name: it.name });
                    });
                });
                sources = flat;

                // Считаем количество iframe-каналов для заголовков групп
                iframeCount = 0;
                rusCount = 0;
                for (let i = 0; i < sources.length; i++) {
                    if (sources[i].type === 'iframe') iframeCount++;
                    else if (sources[i].group && sources[i].group.indexOf('Российские') !== -1) rusCount++;
                }

                uiState.sources = sources.map(s => ({ name: s.name, status: 'waiting' }));
                buildChannelMenu();
                pushLog(`✅ Загружено каналов: ${sources.length}`);
                loadSource(0);
            } catch (e) {
                console.error('Не удалось загрузить sources.json:', e);
                pushLog('❌ sources.json не загружен: ' + e.message);
                uiState.statusLine = 'Ошибка загрузки sources.json';
                // Резервный канал
                sources = [
                    { type: 'iframe', url: 'https://rutube.ru/play/embed/20872670', name: 'Rutube (по умолчанию)' }
                ];
                uiState.sources = sources.map(s => ({ name: s.name, status: 'waiting' }));
                buildChannelMenu();
                loadSource(0);
            }
        }

        // --------------------------------------------------------
        // МЕНЮ
        // --------------------------------------------------------
        function buildChannelMenu() {
            channelList.innerHTML = '';
            let lastGroup = null;

            sources.forEach((src, i) => {
                const group = src.group || '';
                if (group && group !== lastGroup) {
                    const h = document.createElement('div');
                    h.className = 'channelGroup';
                    h.textContent = group;
                    channelList.appendChild(h);
                    lastGroup = group;
                }

                const item = document.createElement('div');
                item.className = 'channelItem' + (i === currentIndex ? ' active' : '');
                item.dataset.index = i;

                const dot = document.createElement('span');
                dot.className = 'statusDot';

                const name = document.createElement('span');
                name.className = 'channelName';
                name.textContent = src.name;

                const type = document.createElement('span');
                type.className = 'channelType';
                type.textContent = (src.type || 'hls').toUpperCase();

                item.appendChild(dot);
                item.appendChild(name);
                item.appendChild(type);

                item.addEventListener('click', () => {
                    if (i === currentIndex && isLoaded) {
                        closeMenu();
                        return;
                    }
                    loadSource(i);
                    closeMenu();
                });

                channelList.appendChild(item);
            });
        }

        function updateMenuStatus() {
            const items = channelList.querySelectorAll('.channelItem');
            items.forEach(item => {
                const i = Number(item.dataset.index);
                item.classList.toggle('active', i === currentIndex);
                item.classList.remove('ok', 'fail', 'loading');
                const status = uiState.sources[i] ? uiState.sources[i].status : 'waiting';
                if (status === 'ready' || status === 'playing') item.classList.add('ok');
                else if (status === 'failed') item.classList.add('fail');
                else if (status === 'loading') item.classList.add('loading');
            });
        }

        function openMenu() {
            channelMenu.classList.add('open');
            menuOverlay.classList.add('show');
        }
        function closeMenu() {
            channelMenu.classList.remove('open');
            menuOverlay.classList.remove('show');
        }

        menuToggle.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMenu();
        });

        // --------------------------------------------------------
        // IFRAME (CSS3D)
        // --------------------------------------------------------
        let currentIframe = null;
        let currentIframeObj = null;
        let iframeReady = false;

        const IFRAME_W = 1280;
        const IFRAME_H = 720;

        function createIframeObject(url) {
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.style.width  = IFRAME_W + 'px';
            iframe.style.height = IFRAME_H + 'px';
            iframe.style.border = 'none';
            iframe.style.background = '#000';
            // ★ iframe НЕ перехватывает клики. Управляем через кнопки.
            iframe.style.pointerEvents = 'none';
            iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('frameborder', '0');

            const obj = new THREE.CSS3DObject(iframe);
            obj.position.set(0, 5.5, 1.05);
            const scale = screenWidth / IFRAME_W;
            obj.scale.set(scale, scale, 1);

            return { obj, iframe };
        }

        function showIframe(url) {
            hideIframe();
            iframeReady = false;

            const { obj, iframe } = createIframeObject(url);
            currentIframeObj = obj;
            currentIframe = iframe;
            scene.add(obj);

            screenMesh.visible = false;
            uiState.mode = 'css3d';

            manageBtn.style.display = 'flex';
            manageBtn.classList.remove('active');
            manageBtn.textContent = '🎮 УПРАВЛЯТЬ ВИДЕО';
            videoControls.classList.remove('show');
        }

        function hideIframe() {
            if (currentIframeObj) {
                scene.remove(currentIframeObj);
                if (currentIframe && currentIframe.parentNode) {
                    currentIframe.parentNode.removeChild(currentIframe);
                }
                currentIframeObj = null;
                currentIframe = null;
            }
            manageBtn.style.display = 'none';
            manageBtn.classList.remove('active');
            iframeReady = false;
            screenMesh.visible = true;
            videoControls.classList.remove('show');
        }

        // ★ Управление — это просто показать панель кнопок.
        // Camera НЕ блокируется, iframe НЕ становится кликабельным.
        // Управление видео идёт только через HTML-кнопки.
        manageBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!currentIframe) return;

            const isOpen = videoControls.classList.contains('show');
            if (isOpen) {
                videoControls.classList.remove('show');
                manageBtn.classList.remove('active');
                manageBtn.textContent = '🎮 УПРАВЛЯТЬ ВИДЕО';
                pushLog('Панель управления скрыта');
            } else {
                videoControls.classList.add('show');
                manageBtn.classList.add('active');
                manageBtn.textContent = '✕ СКРЫТЬ УПРАВЛЕНИЕ';
                pushLog('Панель управления показана');
            }
        });

        // --------------------------------------------------------
        // СОБЫТИЯ ОТ RUTUBE
        // --------------------------------------------------------
        window.addEventListener('message', (event) => {
            let type = null;
            try {
                if (typeof event.data === 'string') {
                    if (event.data.startsWith('{')) {
                        const parsed = JSON.parse(event.data);
                        type = parsed.type || parsed.event;
                    } else {
                        type = event.data;
                    }
                } else if (event.data && typeof event.data === 'object') {
                    type = event.data.type || event.data.event;
                }
            } catch (e) {}
            if (!type) return;

            if (type === 'player:ready') {
                iframeReady = true;
                pushLog('✅ Rutube готов к командам');
            }
        });

        // --------------------------------------------------------
        // ОТПРАВКА КОМАНД В RUTUBE
        // --------------------------------------------------------
        function sendRutube(command, data) {
            if (!currentIframe || !currentIframe.contentWindow) return false;
            const msg = data
                ? JSON.stringify({ type: command, data: data })
                : JSON.stringify({ type: command });
            try {
                currentIframe.contentWindow.postMessage(msg, '*');
                return true;
            } catch (e) {
                console.warn('postMessage error:', e);
                return false;
            }
        }

        // --------------------------------------------------------
        // HLS
        // --------------------------------------------------------
        let currentHls = null;
        let sourceLoadTimeout = null;
        let isLoaded = false;
        let isPlayingVideo = false;
        let pendingHandlers = [];

        function detachPendingHandlers() {
            pendingHandlers.forEach(([ev, fn]) => videoElement.removeEventListener(ev, fn));
            pendingHandlers = [];
        }

        function clearVideoElement() {
            detachPendingHandlers();
            if (currentHls) {
                try { currentHls.destroy(); } catch (e) {}
                currentHls = null;
            }
            videoElement.pause();
            videoElement.removeAttribute('src');
            try { videoElement.load(); } catch (e) {}
        }

        function markSource(index, status) {
            if (uiState.sources[index]) {
                uiState.sources[index].status = status;
            }
            updateMenuStatus();
        }

        function showInfo() {
            uiState.mode = 'info';
            screenMaterial.map = infoTexture;
            screenMaterial.needsUpdate = true;
            screenMesh.visible = true;
        }
        function showVideo() {
            uiState.mode = 'video';
            screenMaterial.map = videoTexture;
            screenMaterial.needsUpdate = true;
            screenMesh.visible = true;
        }

        function tryPlay() {
            if (soundEnabled && userInteracted) {
                videoElement.muted = false;
            } else if (!userInteracted) {
                videoElement.muted = true;
            }

            const p = videoElement.play();
            if (p && p.catch) {
                p.catch(err => {
                    console.warn('play() failed:', err.name);
                    if (!videoElement.muted) {
                        videoElement.muted = true;
                        soundEnabled = false;
                        updateSoundBtn();
                        videoElement.play().catch(e2 => {
                            uiState.statusLine = 'Нажмите для запуска';
                            playHintEl.classList.remove('hidden');
                        });
                    } else {
                        uiState.statusLine = 'Нажмите для запуска';
                        playHintEl.classList.remove('hidden');
                    }
                });
            }
        }

        function loadSource(index) {
            if (sourceLoadTimeout) {
                clearTimeout(sourceLoadTimeout);
                sourceLoadTimeout = null;
            }

            if (index >= sources.length) {
                uiState.currentName = '—';
                uiState.currentStatus = 'failed';
                uiState.statusLine = 'Все каналы недоступны';
                pushLog('❌ Все каналы исчерпаны');
                isLoaded = false;
                isPlayingVideo = false;
                clearVideoElement();
                hideIframe();
                showInfo();
                updateMenuStatus();
                return;
            }

            isLoaded = false;
            isPlayingVideo = false;
            currentIndex = index;
            clearVideoElement();
            hideIframe();

            const source = sources[index];
            pushLog(`[${index + 1}/${sources.length}] Загрузка: ${source.name}`);

            uiState.currentName = source.name;
            uiState.currentStatus = 'loading';
            uiState.statusLine = `Подключение к каналу #${index + 1} из ${sources.length}…`;
            markSource(index, 'loading');
            updateMenuStatus();

            if (source.type === 'iframe') {
                showInfo();
                setTimeout(() => {
                    showIframe(source.url);
                    uiState.currentStatus = 'playing';
                    uiState.statusLine = `▶ ${source.name}`;
                    markSource(index, 'ready');
                    playHintEl.classList.add('hidden');
                    pushLog(`▶ Iframe загружен: ${source.name}`);
                }, 300);
                return;
            }

            // HLS / MP4
            showInfo();

            const onReady = () => {
                if (isLoaded) return;
                isLoaded = true;

                if (sourceLoadTimeout) {
                    clearTimeout(sourceLoadTimeout);
                    sourceLoadTimeout = null;
                }
                detachPendingHandlers();

                pushLog(`✅ Данные получены: ${source.name}`);
                uiState.currentStatus = 'ready';
                uiState.statusLine = 'Канал готов, запускаю…';
                markSource(index, 'ready');
                tryPlay();
            };

            const onMeta = () => onReady();
            const onCanPlay = () => onReady();
            videoElement.addEventListener('loadedmetadata', onMeta);
            videoElement.addEventListener('canplay', onCanPlay);
            pendingHandlers.push(['loadedmetadata', onMeta], ['canplay', onCanPlay]);

            sourceLoadTimeout = setTimeout(() => {
                sourceLoadTimeout = null;
                if (!isLoaded) {
                    pushLog(`⏱ Таймаут: ${source.name}`);
                    markSource(index, 'failed');
                    loadSource(index + 1);
                }
            }, 36000);

            if (source.type === 'mp4') {
                videoElement.src = source.url;
                videoElement.load();
            } else if (source.type === 'hls') {
                if (window.Hls && Hls.isSupported()) {
                    const hls = new Hls({
                        maxBufferLength: 20,
                        maxMaxBufferLength: 40,
                        manifestLoadingTimeOut: 30000,
                        manifestLoadingMaxRetry: 2,
                        levelLoadingTimeOut:    30000,
                        levelLoadingMaxRetry:   2,
                        fragLoadingTimeOut:     60000,
                        fragLoadingMaxRetry:    3,
                        enableWorker: true,
                        lowLatencyMode: false
                    });
                    currentHls = hls;

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        pushLog('HLS: манифест разобран');
                        uiState.statusLine = 'Манифест разобран, буферизация…';
                    });

                    hls.on(Hls.Events.FRAG_LOADED, onReady);

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        console.warn(`HLS: ${data.type} / ${data.details} (fatal=${data.fatal})`);
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                pushLog('HLS: сетевая ошибка, переключаюсь');
                                markSource(index, 'failed');
                                loadSource(index + 1);
                            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                pushLog('HLS: ошибка медиа, пробую восстановить');
                                try { hls.recoverMediaError(); } catch (e) {
                                    markSource(index, 'failed');
                                    loadSource(index + 1);
                                }
                            } else {
                                pushLog('HLS: fatal ошибка');
                                markSource(index, 'failed');
                                loadSource(index + 1);
                            }
                        }
                    });

                    hls.loadSource(source.url);
                    hls.attachMedia(videoElement);
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = source.url;
                    videoElement.load();
                } else {
                    pushLog('HLS не поддерживается');
                    markSource(index, 'failed');
                    loadSource(index + 1);
                }
            }
        }

        videoElement.addEventListener('playing', () => {
            isPlayingVideo = true;
            playHintEl.classList.add('hidden');
            uiState.currentStatus = 'playing';
            uiState.statusLine = `▶ ${sources[currentIndex].name}`;
            pushLog(`▶ Играет: ${sources[currentIndex].name}${videoElement.muted ? ' (без звука)' : ''}`);
            markSource(currentIndex, 'ready');
            showVideo();
        });

        videoElement.addEventListener('pause', () => {
            if (isPlayingVideo) {
                isPlayingVideo = false;
                showInfo();
            }
        });

        videoElement.addEventListener('waiting', () => {
            pushLog('Буферизация…');
        });

        videoElement.addEventListener('error', () => {
            if (!videoElement.currentSrc && !currentHls) return;
            const err = videoElement.error;
            pushLog(`Ошибка <video>: ${err ? err.code : '?'}`);
        });

        document.addEventListener('click', () => {
            if (!userInteracted) {
                userInteracted = true;
                if (!soundEnabled) {
                    enableSound();
                    volumeWrap.classList.add('show');
                    setTimeout(() => volumeWrap.classList.remove('show'), 8000);
                }
                if (videoElement.paused && videoElement.readyState >= 2) {
                    tryPlay();
                }
            }
        });

        // --------------------------------------------------------
        // КНОПКИ УПРАВЛЕНИЯ ВИДЕО — РАБОЧИЕ
        // --------------------------------------------------------
        // Для HLS: работаем с videoElement напрямую
        // Для Rutube: postMessage API + прямое управление iframe-плеером

        // Универсальная отправка любого сообщения в iframe
        function rutubePost(command, data) {
            if (!currentIframe || !currentIframe.contentWindow) return;
            const payload = data
                ? { type: command, data: data }
                : { type: command };
            try {
                currentIframe.contentWindow.postMessage(JSON.stringify(payload), '*');
            } catch (e) {
                console.warn('postMessage failed:', e);
            }
        }

        // Дополнительно: пробуем дотянуться до Rutube-плеера напрямую
        // через его глобальный объект (если он есть в iframe — не сработает
        // из-за cross-origin, но попытка безопасна).
        function rutubePostRaw(cmd) {
            if (!currentIframe || !currentIframe.contentWindow) return;
            try {
                currentIframe.contentWindow.postMessage(cmd, '*');
            } catch (e) {}
        }

        // ---------- PLAY ----------
        document.getElementById('vcPlay').addEventListener('click', () => {
            if (uiState.mode === 'video') {
                videoElement.play().catch(() => {});
                pushLog('▶️ HLS Play');
            } else {
                rutubePost('player:play');
                rutubePostRaw('play');
                pushLog('▶️ Rutube Play');
            }
        });

        // ---------- PAUSE ----------
        document.getElementById('vcPause').addEventListener('click', () => {
            if (uiState.mode === 'video') {
                videoElement.pause();
                pushLog('⏸️ HLS Pause');
            } else {
                rutubePost('player:pause');
                rutubePostRaw('pause');
                pushLog('⏸️ Rutube Pause');
            }
        });

        // ---------- STOP ----------
        document.getElementById('vcStop').addEventListener('click', () => {
            if (uiState.mode === 'video') {
                videoElement.pause();
                videoElement.currentTime = 0;
                pushLog('⏹️ HLS Stop');
            } else {
                rutubePost('player:stop');
                rutubePostRaw('stop');
                pushLog('⏹️ Rutube Stop');
            }
        });

        // ---------- -10 сек ----------
        document.getElementById('vcBack10').addEventListener('click', () => {
            if (uiState.mode === 'video') {
                videoElement.currentTime = Math.max(0, videoElement.currentTime - 10);
                pushLog('⏪ HLS -10 сек');
            } else {
                // Rutube: и relativeSeek, и setTime — отправляем оба
                rutubePost('player:relativeSeek', { time: -10 });
                rutubePost('player:seek', { time: -10 });
                pushLog('⏪ Rutube -10 сек');
            }
        });

        // ---------- +10 сек ----------
        document.getElementById('vcFwd10').addEventListener('click', () => {
            if (uiState.mode === 'video') {
                videoElement.currentTime = Math.min(videoElement.duration || 0, videoElement.currentTime + 10);
                pushLog('⏩ HLS +10 сек');
            } else {
                rutubePost('player:relativeSeek', { time: 10 });
                rutubePost('player:seek', { time: 10 });
                pushLog('⏩ Rutube +10 сек');
            }
        });

        // ---------- ТИШЕ ----------
        document.getElementById('vcVolDown').addEventListener('click', () => {
            if (uiState.mode === 'video') {
                videoElement.volume = Math.max(0, videoElement.volume - 0.1);
                volumeSlider.value = videoElement.volume;
                volumeVal.textContent = Math.round(videoElement.volume * 100) + '%';
                pushLog('🔉 HLS Тише');
            } else {
                // Rutube: setVolume принимает volume 0..100
                // Читаем текущее значение из слайдера и уменьшаем на 10
                const cur = parseFloat(volumeSlider.value) * 100;
                const next = Math.max(0, cur - 10);
                volumeSlider.value = next / 100;
                volumeVal.textContent = Math.round(next) + '%';
                rutubePost('player:setVolume', { volume: next });
                rutubePostRaw('volume:' + Math.round(next));
                pushLog('🔉 Rutube Тише → ' + Math.round(next) + '%');
            }
        });

        // ---------- ГРОМЧЕ ----------
        document.getElementById('vcVolUp').addEventListener('click', () => {
            if (uiState.mode === 'video') {
                videoElement.volume = Math.min(1, videoElement.volume + 0.1);
                volumeSlider.value = videoElement.volume;
                volumeVal.textContent = Math.round(videoElement.volume * 100) + '%';
                pushLog('🔊 HLS Громче');
            } else {
                const cur = parseFloat(volumeSlider.value) * 100;
                const next = Math.min(100, cur + 10);
                volumeSlider.value = next / 100;
                volumeVal.textContent = Math.round(next) + '%';
                rutubePost('player:setVolume', { volume: next });
                rutubePostRaw('volume:' + Math.round(next));
                pushLog('🔊 Rutube Громче → ' + Math.round(next) + '%');
            }
        });

        // ---------- MUTE ----------
        document.getElementById('vcMute').addEventListener('click', () => {
            if (uiState.mode === 'video') {
                if (soundEnabled) disableSound(); else enableSound();
                pushLog('🔇 HLS Mute toggle');
            } else {
                rutubePost('player:mute');
                rutubePost('player:unMute');
                rutubePostRaw('mute');
                pushLog('🔇 Rutube Mute');
            }
        });

        // ---------- FULLSCREEN ----------
        // Разворачиваем на весь экран весь контейнер со сценой и iframe,
        // а не только <html>. Это корректно работает и для CSS3D-слоя.
        document.getElementById('vcFullscreen').addEventListener('click', () => {
            const target = document.body;
            if (!document.fullscreenElement) {
                if (target.requestFullscreen) target.requestFullscreen();
                else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
                else if (target.msRequestFullscreen) target.msRequestFullscreen();
                pushLog('⛶ Fullscreen ON');
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
                pushLog('⛶ Fullscreen OFF');
            }
        });

        // При выходе из fullscreen тоже обновляем размер
        document.addEventListener('fullscreenchange', () => {
            setTimeout(resizeScene, 100);
        });
        document.addEventListener('webkitfullscreenchange', () => {
            setTimeout(resizeScene, 100);
        });

        // ---------- ЗАКРЫТЬ УПРАВЛЕНИЕ ----------
        document.getElementById('vcClose').addEventListener('click', () => {
            videoControls.classList.remove('show');
            manageBtn.classList.remove('active');
            manageBtn.textContent = '🎮 УПРАВЛЯТЬ ВИДЕО';
            pushLog('Панель управления скрыта');
        });

        // --------------------------------------------------------
        // АДАПТАЦИЯ
        // --------------------------------------------------------
        window.addEventListener('resize', resizeScene);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeScene, 50);
            setTimeout(resizeScene, 150);
            setTimeout(resizeScene, 400);
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeScene);
            window.visualViewport.addEventListener('scroll', resizeScene);
        }

        let lastW = window.innerWidth;
        let lastH = window.innerHeight;

        // --------------------------------------------------------
        // АНИМАЦИЯ
        // --------------------------------------------------------
        let clockTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            clockTime += 0.016;

            const w = window.innerWidth;
            const h = window.innerHeight;
            if (w !== lastW || h !== lastH) {
                lastW = w;
                lastH = h;
                resizeScene();
            }

            if (uiState.mode === 'info') {
                uiState.spinner += 0.12;
                drawInfoPanel(clockTime);
                infoTexture.needsUpdate = true;
            }

            if (uiState.mode === 'video' && !videoElement.paused &&
                videoElement.readyState >= 2) {
                videoTexture.needsUpdate = true;
            }

            if (screenGlow) screenGlow.intensity = 1.0 + Math.sin(Date.now() * 0.002) * 0.15;
            controls.update();

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }

        // --------------------------------------------------------
        // СТАРТ
        // --------------------------------------------------------
        loadSourcesFromFile();
        animate();
    })();
    </script>
</body>
</html>
