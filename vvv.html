<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>PeerJS P2P Чат</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: #f0f2f5;
    }
    h1 { color: #333; }
    #myId {
      background: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px dashed #007bff;
      margin-bottom: 15px;
      font-weight: bold;
      word-break: break-all;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #myId .id-text {
      flex: 1;
    }
    .copy-btn {
      background: #28a745;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: #218838; }
    .copy-btn.copied { background: #17a2b8; }
    input, button {
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin: 4px 0;
    }
    button {
      background: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    #chat {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      height: 300px;
      overflow-y: auto;
      margin-top: 15px;
      border: 1px solid #ddd;
    }
    .msg {
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .me {
      background: #dcf8c6;
      margin-left: auto;
      text-align: right;
    }
    .them {
      background: #e9e9eb;
      margin-right: auto;
    }
    .status { font-size: 13px; color: #666; margin: 5px 0; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }

    /* Всплывающее уведомление */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      font-size: 14px;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <h1>🔗 PeerJS P2P Чат</h1>

  <div id="myId">
    <span class="id-text">Ваш ID: <span id="peerId">загрузка...</span></span>
    <button class="copy-btn" id="copyBtn" onclick="copyMyId()">📋 Копировать</button>
  </div>

  <div class="status">Подключиться к другому пользователю:</div>
  <div class="row">
    <input id="remoteId" placeholder="Введите ID собеседника" />
    <button onclick="connectToPeer()">Подключиться</button>
  </div>

  <div class="status" id="status">Статус: не подключён</div>

  <div id="chat"></div>

  <div class="row" style="margin-top:10px">
    <input id="msgInput" placeholder="Введите сообщение..."
           onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()">Отправить</button>
  </div>

  <div id="toast">ID скопирован!</div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    const myId = 'user-' + Math.random().toString(36).substring(2, 8);
    document.getElementById('peerId').textContent = myId;

    const peer = new Peer(myId, { debug: 2 });
    let conn = null;

    peer.on('open', (id) => {
      console.log('Мой Peer ID:', id);
      setStatus('Готов. Ваш ID: ' + id);
    });

    peer.on('error', (err) => {
      console.error(err);
      setStatus('Ошибка: ' + err.type);
    });

    peer.on('connection', (connection) => {
      conn = connection;
      setupConnection();
    });

    function connectToPeer() {
      const remoteId = document.getElementById('remoteId').value.trim();
      if (!remoteId) return alert('Введите ID');
      if (remoteId === myId) return alert('Нельзя подключиться к самому себе');
      conn = peer.connect(remoteId);
      setupConnection();
    }

    function setupConnection() {
      conn.on('open', () => {
        setStatus('✅ Подключено к ' + conn.peer);
        addMessage('Соединение установлено', 'system');
      });
      conn.on('data', (data) => addMessage(data, 'them'));
      conn.on('close', () => {
        setStatus('❌ Соединение закрыто');
        conn = null;
      });
      conn.on('error', (err) => setStatus('Ошибка соединения: ' + err));
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      if (!conn || !conn.open) {
        alert('Нет активного соединения');
        return;
      }
      conn.send(text);
      addMessage(text, 'me');
      input.value = '';
    }

    function addMessage(text, who) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'msg ' + (who === 'system' ? '' : who);
      if (who === 'system') {
        div.style.textAlign = 'center';
        div.style.fontSize = '12px';
        div.style.color = '#888';
      }
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(text) {
      document.getElementById('status').textContent = 'Статус: ' + text;
    }

    // ====== КОПИРОВАНИЕ ID В БУФЕР ======
    function copyMyId() {
      const id = document.getElementById('peerId').textContent;
      const btn = document.getElementById('copyBtn');

      // Современный API
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(id).then(() => onCopied(btn)).catch(() => fallbackCopy(id, btn));
      } else {
        fallbackCopy(id, btn);
      }
    }

    // Резервный способ (для http:// и старых браузеров)
    function fallbackCopy(text, btn) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        onCopied(btn);
      } catch (e) {
        alert('Не удалось скопировать. Скопируйте вручную: ' + text);
      }
      document.body.removeChild(textarea);
    }

    function onCopied(btn) {
      btn.textContent = '✅ Скопировано';
      btn.classList.add('copied');
      showToast('ID скопирован в буфер обмена!');
      setTimeout(() => {
        btn.textContent = '📋 Копировать';
        btn.classList.remove('copied');
      }, 1800);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
  </script>
</body>
</html>
