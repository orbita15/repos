<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Большой Шар и Нектарная Рябь — Ицюань</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05020a; font-family: sans-serif; }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

// ==========================================
// 1. БАЗОВАЯ СЦЕНА
// ==========================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05020a, 0.0015);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10000);
// Отодвинули камеру, так как шар стал больше
camera.position.set(20, 15, 35);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 + 0.05;
controls.enableZoom = false;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.2;

// Свет
scene.add(new THREE.AmbientLight(0x221133, 2));
const moonLight = new THREE.DirectionalLight(0xffddaa, 2);
moonLight.position.set(10, 20, 10);
scene.add(moonLight);

// Увеличили мощность света для большого шара
const orbLight = new THREE.PointLight(0x4fc3f7, 8, 50);
orbLight.position.set(0, 5, 5);
scene.add(orbLight);

// ==========================================
// 2. НЕБО
// ==========================================
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU['turbidity'].value = 20;
skyU['rayleigh'].value = 3;
skyU['mieCoefficient'].value = 0.01;
skyU['mieDirectionalG'].value = 0.8;

const sun = new THREE.Vector3();
const phi = THREE.MathUtils.degToRad(80);
const theta = THREE.MathUtils.degToRad(180);
sun.setFromSphericalCoords(1, phi, theta);
skyU['sunPosition'].value.copy(sun);

// ==========================================
// 3. НЕКТАРНАЯ ВОДА (Сетка 512x512)
// ==========================================
const waterGeometry = new THREE.PlaneGeometry(3000, 3000, 512, 512);

const waterMaterial = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 },
        uFogColor: { value: new THREE.Color(0x05020a) },
        uFogDensity: { value: 0.0015 }
    },
    vertexShader: `
        uniform float uTime;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying float vHeight;
        varying float vFogDepth;
        varying vec2 vUv;

        // Резкая, высокая рябь
        float getWaveHeight(vec2 pos, float time) {
            float h = 0.0;
            // Основные крупные волны
            h += sin(pos.x * 0.1 + time * 1.2) * cos(pos.y * 0.12 + time * 1.0) * 0.8;
            // Резкие заостренные пики
            h += pow(abs(sin(pos.x * 0.3 - time * 2.0)), 3.0) * 0.5;
            h += pow(abs(cos(pos.y * 0.35 + time * 2.5)), 3.0) * 0.4;
            // Мелкая быстрая рябь
            h += sin(pos.x * 0.8 + time * 4.0) * 0.1;
            return h;
        }

        void main() {
            vec3 pos = position;
            vUv = uv;
            
            float h = getWaveHeight(pos.xy, uTime);
            pos.z += h; 
            vHeight = h;

            // Вычисляем нормали
            float eps = 0.1;
            float hx = getWaveHeight(pos.xy + vec2(eps, 0.0), uTime);
            float hy = getWaveHeight(pos.xy + vec2(0.0, eps), uTime);
            
            vec3 v1 = vec3(eps, 0.0, hx - h);
            vec3 v2 = vec3(0.0, eps, hy - h);
            
            vec3 normal = normalize(cross(v1, v2));
            vNormal = normalize(normalMatrix * normal);

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            vViewPosition = -mvPosition.xyz;
            vFogDepth = -mvPosition.z;

            gl_Position = projectionMatrix * mvPosition;
        }
    `,
    fragmentShader: `
        uniform float uTime;
        uniform vec3 uFogColor;
        uniform float uFogDensity;
        
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying float vHeight;
        varying float vFogDepth;
        varying vec2 vUv;

        void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);

            // Переливы нектара
            float mix1 = sin(vUv.x * 15.0 + uTime * 0.4) * 0.5 + 0.5;
            float mix2 = cos(vUv.y * 12.0 - uTime * 0.2) * 0.5 + 0.5;
            
            vec3 colorAmber = vec3(1.0, 0.7, 0.2);
            vec3 colorMagenta = vec3(0.9, 0.2, 0.6);
            vec3 colorCyan = vec3(0.2, 0.9, 1.0);
            
            vec3 nectarColor = mix(colorAmber, colorMagenta, mix1);
            nectarColor = mix(nectarColor, colorCyan, mix2 * 0.5);

            // Блики
            vec3 halfDir = normalize(vec3(0.5, 0.5, 0.5) + viewDir);
            float spec = pow(max(dot(normal, halfDir), 0.0), 80.0); 
            
            // Эффект Френеля
            float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

            // Сборка цвета
            vec3 finalColor = nectarColor * 0.3; 
            finalColor += vec3(1.0, 0.95, 0.9) * spec * 3.0; 
            finalColor += nectarColor * fresnel * 1.5;

            // Подсветка высоких пиков
            float peakGlow = smoothstep(0.6, 1.0, vHeight);
            finalColor += vec3(1.0, 0.8, 0.5) * peakGlow * 0.5;

            // Туман
            float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * vFogDepth * vFogDepth);
            finalColor = mix(finalColor, uFogColor, clamp(fogFactor, 0.0, 1.0));

            gl_FragColor = vec4(finalColor, 1.0);
        }
    `
});

const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.rotation.x = -Math.PI / 2;
water.position.y = -2;
scene.add(water);

// ==========================================
// 4. БОЛЬШОЙ ДЫШАЩИЙ ШАР (x2)
// ==========================================
// Подняли точку покоя, чтобы шар не касался воды
const restPosition = new THREE.Vector3(0, 10, 0); 
// УВЕЛИЧИЛИ РАДИУС В ДВА РАЗА (было 2.5, стало 5.0)
const ballBaseRadius = 5.0;

const ballGeo = new THREE.SphereGeometry(ballBaseRadius, 64, 64);
const ballMat = new THREE.MeshStandardMaterial({
    color: 0x4fc3f7, roughness: 0.2, metalness: 0.1,
    emissive: new THREE.Color(0x1a237e), emissiveIntensity: 0.6,
});

ballMat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.vertexShader = `
        uniform float uTime;
        ${shader.vertexShader}
    `.replace(
        `#include <begin_vertex>`,
        `
        #include <begin_vertex>
        float wave = sin(position.x * 3.0 + uTime) * cos(position.y * 3.0 + uTime * 0.7) * 0.08;
        transformed += normal * wave;
        `
    );
    ballMat.userData.shader = shader;
};

const ball = new THREE.Mesh(ballGeo, ballMat);
ball.position.copy(restPosition);
scene.add(ball);

// ==========================================
// 5. НЕВИДИМЫЕ ПРУЖИНЫ (Раздвинуты под размер шара)
// ==========================================
const anchors = [
    new THREE.Vector3(0, 22, 0),   // Сверху
    new THREE.Vector3(0, -5, 0),   // Снизу
    new THREE.Vector3(15, 10, 0),  // Справа
    new THREE.Vector3(-15, 10, 0), // Слева
    new THREE.Vector3(0, 10, 15),  // Спереди
    new THREE.Vector3(0, 10, -15)  // Сзади
];

const springs = [];
const getSpringPoints = (start, end) => {
    const pts = [];
    for (let i = 0; i <= 20; i++) {
        const t = i / 20;
        const p = new THREE.Vector3().lerpVectors(start, end, t);
        if (i > 0 && i < 20) {
            const dir = new THREE.Vector3().subVectors(end, start).normalize();
            const perp = new THREE.Vector3(dir.y, -dir.x, dir.z).normalize();
            p.add(perp.multiplyScalar(Math.sin(t * Math.PI * 8) * 0.2)); // Увеличили амплитуду пружин
        }
        pts.push(p);
    }
    return pts;
};

anchors.forEach(anchor => {
    const geo = new THREE.BufferGeometry().setFromPoints(getSpringPoints(anchor, restPosition));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffddaa, transparent: true, opacity: 0.3 }));
    scene.add(line);
    springs.push({ line, anchor });
});

// ==========================================
// 6. ИНТЕРАКТИВ (Перетаскивание шара)
// ==========================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const plane = new THREE.Plane();
let isDragging = false;
const velocity = new THREE.Vector3(0, 0, 0);

const onPointerDown = (e) => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    
    if (raycaster.intersectObject(ball).length > 0) {
        isDragging = true;
        controls.autoRotate = false;
        controls.enabled = false;
        const camDir = camera.getWorldDirection(new THREE.Vector3());
        plane.setFromNormalAndCoplanarPoint(camDir, ball.position);
        e.stopPropagation();
    }
};

const onPointerMove = (e) => {
    if (!isDragging) return;
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    
    const target = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(plane, target)) {
        ball.position.copy(target);
    }
};

const onPointerUp = () => {
    if (isDragging) {
        isDragging = false;
        controls.enabled = true;
    }
};

renderer.domElement.addEventListener('pointerdown', onPointerDown, { capture: true });
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);

// ==========================================
// 7. АНИМАЦИЯ
// ==========================================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.elapsedTime;

    // Обновляем время в шейдере воды
    waterMaterial.uniforms.uTime.value = elapsed;

    // --- Физика шара ---
    if (!isDragging) {
        const force = new THREE.Vector3().subVectors(restPosition, ball.position);
        // Немного уменьшили жесткость пружин, так как шар стал тяжелее (больше)
        velocity.add(force.multiplyScalar(0.04));
        velocity.multiplyScalar(0.93);
        ball.position.add(velocity.clone().multiplyScalar(delta * 60));
    } else {
        velocity.set(0, 0, 0);
    }

    // Дыхание шара
    const breathScale = 1.0 + Math.sin(elapsed * 1.5) * 0.05;
    ball.scale.set(breathScale, breathScale, breathScale);

    if (ballMat.userData.shader) {
        ballMat.userData.shader.uniforms.uTime.value = elapsed;
    }

    // Свет
    orbLight.intensity = 6 + Math.sin(elapsed * 1.5) * 2;
    orbLight.position.copy(ball.position).add(new THREE.Vector3(0, 0, 5));

    // Пружины
    springs.forEach(({ line, anchor }) => {
        line.geometry.setFromPoints(getSpringPoints(anchor, ball.position));
    });

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
