<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ночная парковка — Уличный кинотеатр</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: Arial, Helvetica, sans-serif; width: 100%; height: 100%; }

        #webglCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: block; }
        #css3dLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        #info { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px; pointer-events: none; z-index: 100; font-size: 13px; white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }

        #menuToggle { position: absolute; top: 20px; left: 20px; z-index: 200; width: 48px; height: 48px; border-radius: 8px; background: rgba(0,0,0,0.8); color: #fff; border: 2px solid #555; font-size: 22px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; transition: all 0.2s; padding: 0; }
        #menuToggle:hover, #menuToggle:active { background: #333; border-color: #888; }

        #channelMenu { position: absolute; top: 0; left: 0; bottom: 0; width: min(320px, 85vw); background: rgba(10, 14, 24, 0.97); border-right: 2px solid #2a7; z-index: 190; transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; box-shadow: 4px 0 30px rgba(0,0,0,0.8); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
        #channelMenu.open { transform: translateX(0); }

        #menuHeader { padding: 16px 20px; border-bottom: 2px solid #2a7; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        #menuHeader h2 { margin: 0; color: #4dff9a; font-size: 17px; font-weight: bold; letter-spacing: 0.5px; }
        #menuClose { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
        #menuClose:hover { color: #fff; background: rgba(255,255,255,0.1); }

        #channelList { flex: 1; overflow-y: auto; padding: 8px 0; -webkit-overflow-scrolling: touch; }
        .channelGroup { padding: 10px 20px 6px; color: #7ec8ff; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; opacity: 0.7; }

        .channelItem { display: flex; align-items: center; gap: 10px; padding: 11px 20px; cursor: pointer; color: #c8d0dc; font-size: 14px; transition: background 0.15s; border-left: 3px solid transparent; text-decoration: none; }
        .channelItem:hover, .channelItem:active { background: rgba(120, 200, 255, 0.08); color: #fff; }
        .channelItem.active { background: rgba(77, 255, 154, 0.12); border-left-color: #4dff9a; color: #fff; font-weight: bold; }

        .statusDot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; transition: all 0.3s; }
        .channelName { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .channelType { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); color: #8fa0b5; font-family: monospace; flex-shrink: 0; }

        #menuOverlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 180; opacity: 0; pointer-events: none; transition: opacity 0.35s; }
        #menuOverlay.show { opacity: 1; pointer-events: auto; }

        #joystick { position: absolute; bottom: 24px; left: 24px; z-index: 250; display: none; touch-action: none; user-select: none; -webkit-user-select: none; }
        @media (pointer: coarse) { #joystick { display: block; } }
        #joystickBase { width: 120px; height: 120px; border-radius: 50%; background: rgba(0, 0, 0, 0.45); border: 2px solid rgba(77, 255, 154, 0.55); position: relative; box-shadow: 0 0 20px rgba(77, 255, 154, 0.35); touch-action: none; }
        #joystickKnob { width: 52px; height: 52px; border-radius: 50%; background: rgba(77, 255, 154, 0.85); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(77, 255, 154, 0.7); pointer-events: none; }
        #moveHint { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0, 0, 0, 0.75); padding: 8px 16px; border-radius: 8px; font-size: 12px; z-index: 100; pointer-events: none; transition: opacity 0.6s; white-space: nowrap; border: 1px solid rgba(77, 255, 154, 0.4); }
        #moveHint.hidden { opacity: 0; }
        @media (pointer: coarse) { #moveHint { display: none; } }

        @media (max-width: 600px) {
            #info { top: 20px; left: 78px; right: 78px; transform: none; font-size: 11px; padding: 6px 10px; max-width: none; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            #menuToggle { width: 44px; height: 44px; font-size: 20px; top: 18px; left: 14px; }
            .channelItem { padding: 12px 16px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div id="info">🎥 Ночная парковка — Уличный кинотеатр</div>

    <button id="menuToggle">☰</button>
    <div id="menuOverlay"></div>

    <div id="channelMenu">
        <div id="menuHeader">
            <h2>📺 КАНАЛЫ</h2>
            <button id="menuClose">✕</button>
        </div>
        <div id="channelList"></div>
    </div>

    <div id="joystick">
        <div id="joystickBase">
            <div id="joystickKnob"></div>
        </div>
    </div>
    <div id="moveHint">WASD / стрелки — ходить</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>

    <script>
        // ============================================================
        // 1. СЦЕНА
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.01);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(14, 3, 26);
        camera.lookAt(0, 4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.domElement.id = 'webglCanvas';
        document.body.appendChild(renderer.domElement);

        const cssRenderer = new THREE.CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.domElement.id = 'css3dLayer';
        document.body.appendChild(cssRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 4, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minPolarAngle = 0.15;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 5;
        controls.maxDistance = 70;

        // ============================================================
        // 2. СВЕТ
        // ============================================================
        scene.add(new THREE.AmbientLight(0x40405a, 0.65));

        const moonLight = new THREE.DirectionalLight(0x8899bb, 0.45);
        moonLight.position.set(-15, 25, -10);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048;
        moonLight.shadow.mapSize.height = 2048;
        moonLight.shadow.camera.left   = -50;
        moonLight.shadow.camera.right  =  50;
        moonLight.shadow.camera.top    =  50;
        moonLight.shadow.camera.bottom = -50;
        scene.add(moonLight);

        const domeGlow = new THREE.PointLight(0x4ea8ff, 0.6, 150, 1.2);
        domeGlow.position.set(0, 40, 0);
        scene.add(domeGlow);

        const spotLight = new THREE.SpotLight(0xffdd88, 1.5);
        spotLight.position.set(8, 12, 10);
        spotLight.target.position.set(0, 0, 0);
        spotLight.angle = Math.PI / 5;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        scene.add(spotLight);
        scene.add(spotLight.target);

        // ============================================================
        // 3. ЗЕМЛЯ
        // ============================================================
        const groundCanvas = document.createElement('canvas');
        groundCanvas.width = 1024;
        groundCanvas.height = 1024;
        const gctx = groundCanvas.getContext('2d');

        const groundGrad = gctx.createRadialGradient(512, 512, 60, 512, 512, 480);
        groundGrad.addColorStop(0.00, '#1e1e28');
        groundGrad.addColorStop(0.20, '#15151e');
        groundGrad.addColorStop(0.40, '#0e0e18');
        groundGrad.addColorStop(0.58, '#09090f');
        groundGrad.addColorStop(0.72, '#050510');
        groundGrad.addColorStop(0.85, '#050510');
        groundGrad.addColorStop(1.00, '#050510');

        gctx.fillStyle = groundGrad;
        gctx.fillRect(0, 0, 1024, 1024);

        gctx.fillStyle = 'rgba(255,255,255,0.010)';
        for (let i = 0; i < 3500; i++) {
            gctx.fillRect(Math.random() * 1024, Math.random() * 1024, 1, 1);
        }

        const groundTexture = new THREE.CanvasTexture(groundCanvas);
        groundTexture.encoding = THREE.sRGBEncoding;
        groundTexture.minFilter = THREE.LinearFilter;
        groundTexture.magFilter = THREE.LinearFilter;
        groundTexture.generateMipmaps = false;

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 1.0, metalness: 0.0 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const lineMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
        for (let i = -3; i <= 3; i++) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.01, 12), lineMaterial);
            line.position.set(i * 5, 0.02, 0);
            line.receiveShadow = true;
            scene.add(line);
        }

        // ============================================================
        // 4. КИНОЭКРАН (В ДВА РАЗА БОЛЬШЕ)
        // ============================================================
        const SCREEN_WIDTH = 19.36;
        const SCREEN_HEIGHT = 10.89;
        const SCREEN_Y = SCREEN_HEIGHT / 2;
        const SCREEN_Z = 0;
        
        const IFRAME_W = 1280;
        const IFRAME_H = 720;
        
        // Ссылка на видео ВКонтакте (преобразованная из m.vkvideo.ru)
        const VK_VIDEO_URL = 'https://vkvideo.ru/video_ext.php?oid=-230306612&id=456239224&autoplay=1&hd=2';

        const iframeStyle = `
            width: ${IFRAME_W}px; height: ${IFRAME_H}px;
            border: none;
            background: transparent;
            pointer-events: auto;
        `;

        function showVkIframe() {
            const iframe = document.createElement('iframe');
            iframe.src = VK_VIDEO_URL;
            iframe.style.cssText = iframeStyle;
            iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('frameborder', '0');

            const obj = new THREE.CSS3DObject(iframe);
            obj.position.set(0, SCREEN_Y, SCREEN_Z);
            const scale = SCREEN_WIDTH / IFRAME_W;
            obj.scale.set(scale, scale, 1);
            scene.add(obj);
        }
        showVkIframe();

        // ============================================================
        // 5. МЕНЮ
        // ============================================================
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const channelMenu = document.getElementById('channelMenu');
        const channelList = document.getElementById('channelList');
        const menuOverlay = document.getElementById('menuOverlay');

        function buildMenu() {
            channelList.innerHTML = '';
            const group = document.createElement('div');
            group.className = 'channelGroup';
            group.textContent = '🎬 Видео';
            channelList.appendChild(group);

            const item = document.createElement('div');
            item.className = 'channelItem active';
            
            const dot = document.createElement('span');
            dot.className = 'statusDot';
            dot.style.background = '#4dff9a';
            dot.style.boxShadow = '0 0 8px #4dff9a';
            
            const name = document.createElement('span');
            name.className = 'channelName';
            name.textContent = 'VK Видео';
            
            const type = document.createElement('span');
            type.className = 'channelType';
            type.textContent = 'VK';

            item.appendChild(dot);
            item.appendChild(name);
            item.appendChild(type);
            
            channelList.appendChild(item);
        }

        function openMenu() { channelMenu.classList.add('open'); menuOverlay.classList.add('show'); }
        function closeMenu() { channelMenu.classList.remove('open'); menuOverlay.classList.remove('show'); }

        menuToggle.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

        buildMenu();

        // ============================================================
        // 6. ОКРУЖЕНИЕ (Машины, фонари, деревья)
        // ============================================================
        function createCar(color, x, z, rotationY = 0) {
            const carGroup = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 0.6, 4.2),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.6 })
            );
            body.position.y = 0.5; body.castShadow = true; body.receiveShadow = true;
            carGroup.add(body);
            const cabin = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 0.5, 2.0),
                new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.3 })
            );
            cabin.position.set(0, 1.0, -0.3); cabin.castShadow = true;
            carGroup.add(cabin);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 12);
            [[-0.9, 0.35, 1.4], [0.9, 0.35, 1.4], [-0.9, 0.35, -1.4], [0.9, 0.35, -1.4]].forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2; wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true; carGroup.add(wheel);
            });
            const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffffaa, emissiveIntensity: 0.8 });
            const headlightGeo = new THREE.SphereGeometry(0.12, 8, 8);
            const hl1 = new THREE.Mesh(headlightGeo, headlightMat); hl1.position.set(-0.6, 0.55, 2.1); carGroup.add(hl1);
            const hl2 = new THREE.Mesh(headlightGeo, headlightMat); hl2.position.set(0.6, 0.55, 2.1); carGroup.add(hl2);
            carGroup.position.set(x, 0, z);
            carGroup.rotation.y = rotationY;
            return carGroup;
        }

        const carColors = [0xaa2222, 0x2244aa, 0x22aa44, 0xcccccc, 0x8844aa, 0xcc6622];
        const carPositions = [
            { x: -12, z: 16, ry: 0.1 }, { x: -6, z: 17, ry: -0.05 },
            { x: 6, z: 16.5, ry: 0.05 }, { x: 12, z: 17, ry: -0.1 },
            { x: -15, z: 22, ry: 0.2 }, { x: 15, z: 21, ry: -0.15 }
        ];
        carPositions.forEach((pos, i) => { scene.add(createCar(carColors[i % carColors.length], pos.x, pos.z, pos.ry)); });

        function createStreetLamp(x, z) {
            const lampGroup = new THREE.Group();
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.5, metalness: 0.8 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 8, 8), poleMat);
            pole.position.y = 4; pole.castShadow = true; lampGroup.add(pole);
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.5), poleMat);
            arm.position.set(0, 7.8, 0.7); lampGroup.add(arm);
            const bulb = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0xffeedd, emissive: 0xffcc88, emissiveIntensity: 1.5 })
            );
            bulb.position.set(0, 7.8, 1.4); lampGroup.add(bulb);
            const lampLight = new THREE.PointLight(0xffcc88, 0.8, 20, 2);
            lampLight.position.set(0, 7.8, 1.4); lampGroup.add(lampLight);
            lampGroup.position.set(x, 0, z);
            return lampGroup;
        }
        scene.add(createStreetLamp(-18, 10));
        scene.add(createStreetLamp(18, 10));
        scene.add(createStreetLamp(-18, 24));
        scene.add(createStreetLamp(18, 24));

        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            const r = 200 + Math.random() * 200;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPositions[i]     = r * Math.sin(phi) * Math.cos(theta);
            starPositions[i + 1] = r * Math.cos(phi);
            starPositions[i + 2] = r * Math.sin(phi) * Math.sin(theta);
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({
            color: 0xffffff, size: 1.0, transparent: true, opacity: 0.85, fog: false
        })));

        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.95 });
        const leafMatDeciduous = new THREE.MeshStandardMaterial({ color: 0x1e4a1e, roughness: 0.95 });
        const leafMatFir = new THREE.MeshStandardMaterial({ color: 0x153515, roughness: 0.95 });

        function createTree(x, z, scale = 1) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 3, 6), trunkMat);
            trunk.position.y = 1.5; trunk.castShadow = true; group.add(trunk);
            const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(1.8, 8, 6), leafMatDeciduous);
            leaf1.position.y = 3.8; leaf1.castShadow = true; group.add(leaf1);
            const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(1.4, 8, 6), leafMatDeciduous);
            leaf2.position.set(0.7, 4.6, 0.3); leaf2.castShadow = true; group.add(leaf2);
            const leaf3 = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 6), leafMatDeciduous);
            leaf3.position.set(-0.6, 4.9, -0.4); leaf3.castShadow = true; group.add(leaf3);
            group.position.set(x, 0, z); group.scale.setScalar(scale);
            group.rotation.y = Math.random() * Math.PI * 2;
            return group;
        }

        function createFir(x, z, scale = 1) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 2, 6), trunkMat);
            trunk.position.y = 1; trunk.castShadow = true; group.add(trunk);
            [{ r: 2.0, h: 2.5, y: 2.6 }, { r: 1.5, h: 2.0, y: 4.1 }, { r: 1.0, h: 1.6, y: 5.3 }].forEach(l => {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(l.r, l.h, 8), leafMatFir);
                cone.position.y = l.y; cone.castShadow = true; group.add(cone);
            });
            group.position.set(x, 0, z); group.scale.setScalar(scale);
            group.rotation.y = Math.random() * Math.PI * 2;
            return group;
        }

        const treePositions = [
            [-26, -18, 1.3, 'fir'], [-18, -23, 1.1, 'fir'], [-10, -26, 1.4, 'fir'], [-2,  -29, 1.2, 'broad'],
            [6,   -26, 1.3, 'fir'], [14,  -23, 1.0, 'broad'], [22,  -21, 1.2, 'fir'], [30,  -16, 1.1, 'broad'],
            [-30, -10, 1.2, 'broad'], [-33, -2, 1.4, 'fir'], [-35,  8,  1.1, 'broad'], [-32, 16, 1.3, 'fir'],
            [-30,  24, 1.0, 'broad'], [-28, 32, 1.2, 'fir'], [30,  -10, 1.3, 'broad'], [33, -2,  1.1, 'fir'],
            [35,   8,  1.4, 'broad'], [32, 16,  1.2, 'fir'], [30,   24, 1.1, 'broad'], [28, 32,  1.3, 'fir'],
            [-22, 36, 1.2, 'broad'], [-12, 38, 1.0, 'fir'], [0,   40, 1.3, 'broad'], [12,  38, 1.1, 'fir'],
            [22,  36, 1.2, 'broad']
        ];
        treePositions.forEach(([x, z, s, type]) => {
            if (type === 'fir') scene.add(createFir(x, z, s));
            else scene.add(createTree(x, z, s));
        });

        // ============================================================
        // 7. АДАПТАЦИЯ
        // ============================================================
        function resizeRenderer() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(w, h);
            cssRenderer.setSize(w, h);
        }

        window.addEventListener('resize', resizeRenderer);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeRenderer, 50);
            setTimeout(resizeRenderer, 150);
            setTimeout(resizeRenderer, 400);
        });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeRenderer);
        let lastW = window.innerWidth;
        let lastH = window.innerHeight;

        // ============================================================
        // 8. ЧЕЛОВЕЧКИ И МУЛЬТИПЛЕЕР
        // ============================================================
        const CHAR_COLORS = [0xff6b6b, 0x4ecdc4, 0xffd93d, 0x95e1d3, 0xa06bff, 0xff9f43, 0x54a0ff, 0xee5a24, 0x7bed9f, 0xff4757, 0x1e90ff, 0xffa502];
        function randomCharColor() { return CHAR_COLORS[Math.floor(Math.random() * CHAR_COLORS.length)]; }

        let myCharacter = null;
        let myWalkPhase = 0;
        let localOpacity = 0;
        const myColor = randomCharColor();
        const peers = {};

        function makeCapsule(radius, length, radialSeg, mat) {
            const g = new THREE.Group();
            const cylH = length;
            const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, cylH, radialSeg), mat);
            cyl.castShadow = true; g.add(cyl);
            const sphereGeo = new THREE.SphereGeometry(radius, radialSeg, Math.max(6, Math.floor(radialSeg / 2)));
            const top = new THREE.Mesh(sphereGeo, mat); top.position.y =  cylH / 2; top.castShadow = true; g.add(top);
            const bot = new THREE.Mesh(sphereGeo, mat); bot.position.y = -cylH / 2; bot.castShadow = true; g.add(bot);
            return g;
        }

        function createCharacter(color) {
            const group = new THREE.Group();
            const bodyMat  = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.15 });
            const skinMat  = new THREE.MeshStandardMaterial({ color: 0xffd4a8, roughness: 0.85 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9 });
            const shoeMat  = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const eyeMat   = new THREE.MeshBasicMaterial({ color: 0x000000 });

            const torso = makeCapsule(0.32, 0.55, 12, bodyMat); torso.position.y = 1.3; group.add(torso);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 20), skinMat); head.position.y = 2.1; head.castShadow = true; group.add(head);
            const eyeGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const lEye = new THREE.Mesh(eyeGeo, eyeMat); lEye.position.set(-0.1, 2.15, 0.24); group.add(lEye);
            const rEye = new THREE.Mesh(eyeGeo, eyeMat); rEye.position.set(0.1, 2.15, 0.24); group.add(rEye);

            const leftArmPivot = new THREE.Group(); leftArmPivot.position.set(-0.42, 1.65, 0);
            const leftArm = makeCapsule(0.08, 0.5, 8, bodyMat); leftArm.position.y = -0.33; leftArmPivot.add(leftArm); group.add(leftArmPivot);

            const rightArmPivot = new THREE.Group(); rightArmPivot.position.set(0.42, 1.65, 0);
            const rightArm = makeCapsule(0.08, 0.5, 8, bodyMat); rightArm.position.y = -0.33; rightArmPivot.add(rightArm); group.add(rightArmPivot);

            const leftLegPivot = new THREE.Group(); leftLegPivot.position.set(-0.15, 0.9, 0);
            const leftLeg = makeCapsule(0.1, 0.7, 8, pantsMat); leftLeg.position.y = -0.45; leftLegPivot.add(leftLeg);
            const leftShoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.1, 0.32), shoeMat); leftShoe.position.set(0, -0.85, 0.06); leftShoe.castShadow = true; leftLegPivot.add(leftShoe); group.add(leftLegPivot);

            const rightLegPivot = new THREE.Group(); rightLegPivot.position.set(0.15, 0.9, 0);
            const rightLeg = makeCapsule(0.1, 0.7, 8, pantsMat); rightLeg.position.y = -0.45; rightLegPivot.add(rightLeg);
            const rightShoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.1, 0.32), shoeMat); rightShoe.position.set(0, -0.85, 0.06); rightShoe.castShadow = true; rightLegPivot.add(rightShoe); group.add(rightLegPivot);

            group.userData.parts = { torso, head, leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot };
            group.userData.walkAmp = 0;
            return group;
        }

        function setCharacterOpacity(group, opacity) {
            group.traverse(obj => { if (obj.isMesh && obj.material) { obj.material.transparent = true; obj.material.opacity = opacity; } });
            group.visible = opacity > 0.01;
        }

        function animateWalk(group, phase, moving, dt) {
            const parts = group.userData.parts;
            if (!parts) return;
            const targetAmp = moving ? 1 : 0;
            group.userData.walkAmp += (targetAmp - group.userData.walkAmp) * Math.min(1, dt * 6);
            const amp = group.userData.walkAmp;
            const swing    = Math.sin(phase) * 0.7 * amp;
            const swingOpp = Math.sin(phase + Math.PI) * 0.7 * amp;
            parts.leftLegPivot.rotation.x  = swing; parts.rightLegPivot.rotation.x = swingOpp;
            parts.leftArmPivot.rotation.x  = swingOpp * 0.85; parts.rightArmPivot.rotation.x = swing * 0.85;
        }

        myCharacter = createCharacter(myColor);
        myCharacter.position.set(0, 0, 22); myCharacter.rotation.y = Math.PI;
        setCharacterOpacity(myCharacter, 0); scene.add(myCharacter);

        let room = null, posAction = null, joinAction = null, leaveAction = null;
        async function initMultiplayer() {
            try {
                const { joinRoom } = await import('https://esm.run/trystero');
                room = joinRoom({ appId: 'cinema-parking-multiplayer' }, 'main');
                posAction   = room.makeAction('pos'); joinAction  = room.makeAction('join'); leaveAction = room.makeAction('leave');

                joinAction.onMessage = (data, { peerId }) => {
                    if (!peers[peerId]) spawnPeer(peerId, data.color, data.x, data.z);
                    else { peers[peerId].fading = false; peers[peerId].targetX = data.x; peers[peerId].targetZ = data.z; }
                    if (myCharacter && posAction) posAction.send({ x: myCharacter.position.x, z: myCharacter.position.z, rot: myCharacter.rotation.y }, { target: peerId });
                };
                posAction.onMessage = (data, { peerId }) => {
                    if (!peers[peerId]) spawnPeer(peerId, null, data.x, data.z);
                    const p = peers[peerId]; if (!p) return;
                    p.lastSeen = Date.now(); p.targetX = data.x; p.targetZ = data.z; p.targetRot = data.rot;
                };
                leaveAction.onMessage = (data, { peerId }) => { if (peers[peerId]) peers[peerId].fading = true; };
                room.onPeerJoin = (peerId) => { if (joinAction && myCharacter) joinAction.send({ color: myColor, x: myCharacter.position.x, z: myCharacter.position.z }, { target: peerId }); };
                room.onPeerLeave = (peerId) => { if (peers[peerId]) peers[peerId].fading = true; };
                setInterval(() => { if (posAction && myCharacter) posAction.send({ x: myCharacter.position.x, z: myCharacter.position.z, rot: myCharacter.rotation.y }); }, 100);
                setInterval(() => { const now = Date.now(); for (const id in peers) { if (!peers[id].fading && now - peers[id].lastSeen > 4000) peers[id].fading = true; } }, 1000);
                const leave = () => { if (leaveAction) leaveAction.send({}); if (room) room.leave(); };
                window.addEventListener('beforeunload', leave); window.addEventListener('pagehide', leave);
            } catch (err) { console.warn('Trystero не загрузился:', err); }
        }

        function spawnPeer(id, color, x, z) {
            if (peers[id]) { peers[id].fading = false; peers[id].lastSeen = Date.now(); return; }
            const c = createCharacter(color || randomCharColor());
            const px = (typeof x === 'number' && isFinite(x)) ? x : 0;
            const pz = (typeof z === 'number' && isFinite(z)) ? z : 22;
            c.position.set(px, 0, pz); setCharacterOpacity(c, 0); scene.add(c);
            peers[id] = { group: c, opacity: 0, fading: false, lastSeen: Date.now(), targetX: px, targetZ: pz, targetRot: 0, walkPhase: 0 };
        }

        initMultiplayer();

        const keys = {};
        document.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); keys[k] = true; if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault(); });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        const joyInput = { x: 0, y: 0 };
        const joystickBase = document.getElementById('joystickBase');
        const joystickKnob = document.getElementById('joystickKnob');
        let joyActive = false, joyCenter = { x: 0, y: 0 };

        if (joystickBase) {
            joystickBase.addEventListener('pointerdown', (e) => {
                e.preventDefault(); joyActive = true;
                try { joystickBase.setPointerCapture(e.pointerId); } catch (err) {}
                const rect = joystickBase.getBoundingClientRect();
                joyCenter.x = rect.left + rect.width / 2; joyCenter.y = rect.top + rect.height / 2;
                updateJoy(e.clientX, e.clientY);
            });
            joystickBase.addEventListener('pointermove', (e) => { if (joyActive) updateJoy(e.clientX, e.clientY); });
            const resetJoy = () => { joyActive = false; joyInput.x = 0; joyInput.y = 0; if (joystickKnob) joystickKnob.style.transform = 'translate(-50%, -50%)'; };
            joystickBase.addEventListener('pointerup', resetJoy); joystickBase.addEventListener('pointercancel', resetJoy); joystickBase.addEventListener('lostpointercapture', resetJoy);
        }

        function updateJoy(cx, cy) {
            let dx = cx - joyCenter.x, dy = cy - joyCenter.y;
            const max = 45, d = Math.hypot(dx, dy);
            if (d > max) { dx = dx / d * max; dy = dy / d * max; }
            if (joystickKnob) joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyInput.x = dx / max; joyInput.y = dy / max;
        }

        function getInput() {
            let ix = 0, iy = 0;
            if (keys['w'] || keys['arrowup']    || keys['ц']) iy -= 1;
            if (keys['s'] || keys['arrowdown']  || keys['ы']) iy += 1;
            if (keys['a'] || keys['arrowleft']  || keys['ф']) ix -= 1;
            if (keys['d'] || keys['arrowright'] || keys['в']) ix += 1;
            ix += joyInput.x; iy += joyInput.y;
            const len = Math.hypot(ix, iy);
            if (len > 1) { ix /= len; iy /= len; }
            return { x: ix, y: iy };
        }

        const MOVE_SPEED = 5.5, BOUNDS = 32;
        function updateCharacters(dt) {
            if (myCharacter) {
                if (localOpacity < 1) { localOpacity = Math.min(1, localOpacity + dt * 0.8); setCharacterOpacity(myCharacter, localOpacity); }
                const input = getInput();
                const camForward = new THREE.Vector3(); camera.getWorldDirection(camForward); camForward.y = 0; camForward.normalize();
                const camRight = new THREE.Vector3().crossVectors(camForward, new THREE.Vector3(0, 1, 0)).normalize();
                const moveVec = new THREE.Vector3().addScaledVector(camForward, -input.y).addScaledVector(camRight, input.x);
                const mag = moveVec.length(); const moving = mag > 0.05;

                if (moving) {
                    moveVec.normalize().multiplyScalar(MOVE_SPEED * dt);
                    myCharacter.position.x += moveVec.x; myCharacter.position.z += moveVec.z;
                    myCharacter.position.x = Math.max(-BOUNDS, Math.min(BOUNDS, myCharacter.position.x));
                    myCharacter.position.z = Math.max(-BOUNDS, Math.min(BOUNDS, myCharacter.position.z));
                    const targetRot = Math.atan2(moveVec.x, moveVec.z);
                    let dRot = targetRot - myCharacter.rotation.y;
                    while (dRot >  Math.PI) dRot -= Math.PI * 2; while (dRot < -Math.PI) dRot += Math.PI * 2;
                    myCharacter.rotation.y += dRot * Math.min(1, dt * 12);
                    myWalkPhase += dt * 14;
                }
                animateWalk(myCharacter, myWalkPhase, moving, dt);
                controls.target.x += (myCharacter.position.x - controls.target.x) * Math.min(1, dt * 4);
                controls.target.y += (3.0 - controls.target.y) * Math.min(1, dt * 4);
                controls.target.z += (myCharacter.position.z - controls.target.z) * Math.min(1, dt * 4);
                if (moving) { const hint = document.getElementById('moveHint'); if (hint && !hint.classList.contains('hidden')) hint.classList.add('hidden'); }
            }

            for (const id in peers) {
                const p = peers[id], g = p.group;
                if (p.fading) {
                    p.opacity = Math.max(0, p.opacity - dt * 1.2);
                    if (p.opacity <= 0) {
                        scene.remove(g);
                        g.traverse(o => { if (o.isMesh) { if (o.geometry) o.geometry.dispose(); if (o.material) { const mats = Array.isArray(o.material) ? o.material : [o.material]; mats.forEach(m => m.dispose()); } } });
                        delete peers[id]; continue;
                    }
                } else p.opacity = Math.min(1, p.opacity + dt * 0.8);
                setCharacterOpacity(g, p.opacity);
                const lerp = Math.min(1, dt * 8);
                const dx = p.targetX - g.position.x, dz = p.targetZ - g.position.z;
                g.position.x += dx * lerp; g.position.z += dz * lerp;
                let dRot = p.targetRot - g.rotation.y;
                while (dRot >  Math.PI) dRot -= Math.PI * 2; while (dRot < -Math.PI) dRot += Math.PI * 2;
                g.rotation.y += dRot * lerp;
                const speed = Math.hypot(dx, dz); const moving = speed > 0.05;
                if (moving) p.walkPhase += dt * 14;
                animateWalk(g, p.walkPhase, moving, dt);
            }
        }

        setTimeout(() => { const hint = document.getElementById('moveHint'); if (hint) hint.classList.add('hidden'); }, 8000);

        // ============================================================
        // 9. АНИМАЦИЯ
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            const w = window.innerWidth, h = window.innerHeight;
            if (w !== lastW || h !== lastH) { lastW = w; lastH = h; resizeRenderer(); }

            updateCharacters(0.016);

            controls.update();

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
