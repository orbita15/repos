<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шар на пружинах</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #02050a; font-family: sans-serif; }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';

// ==========================================
// 1. БАЗОВАЯ СЦЕНА И ОСВЕЩЕНИЕ
// ==========================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02050a, 0.0015);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10000);
// Поднимаем камеру чуть выше, чтобы смотреть на парящий шар
camera.position.set(12, 10, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 + 0.05;
controls.enableZoom = false;
controls.enablePan = false;
// Автовращение камеры для медитативного эффекта
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// Свет
scene.add(new THREE.AmbientLight(0x222233, 2));
const moonLight = new THREE.DirectionalLight(0x88ccff, 2);
moonLight.position.set(10, 20, 10);
scene.add(moonLight);

// Свет из глубины (подсвечивает воду и низ шара)
const deepLight = new THREE.PointLight(0x00e5ff, 5, 30);
deepLight.position.set(0, 0, 0);
scene.add(deepLight);

// Точечный свет рядом с шаром (чтобы он ярко выделялся)
const orbLight = new THREE.PointLight(0x4fc3f7, 4, 20);
orbLight.position.set(0, 5, 5);
scene.add(orbLight);

// ==========================================
// 2. НЕБО И ВОДА
// ==========================================
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU['turbidity'].value = 10;
skyU['rayleigh'].value = 2;
skyU['mieCoefficient'].value = 0.005;
skyU['mieDirectionalG'].value = 0.8;

const sun = new THREE.Vector3();
const phi = THREE.MathUtils.degToRad(85);
const theta = THREE.MathUtils.degToRad(180);
sun.setFromSphericalCoords(1, phi, theta);
skyU['sunPosition'].value.copy(sun);

// Процедурная текстура нормалей для воды
const waterNormals = (() => {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(size, size);
    for (let i = 0; i < size * size; i++) {
        const x = i % size; const y = Math.floor(i / size);
        imgData.data[i*4] = (Math.sin(x*0.2) * 0.5 + 0.5) * 255;
        imgData.data[i*4+1] = (Math.cos(y*0.2) * 0.5 + 0.5) * 255;
        imgData.data[i*4+2] = 255; imgData.data[i*4+3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.NoColorSpace;
    return tex;
})();

const water = new Water(new THREE.PlaneGeometry(10000, 10000), {
    textureWidth: 512, textureHeight: 512,
    waterNormals: waterNormals,
    sunDirection: sun.clone().normalize(),
    sunColor: 0xffffff, waterColor: 0x001e3c,
    distortionScale: 3.7, fog: scene.fog !== undefined,
});
water.rotation.x = -Math.PI / 2;
water.position.y = -2;
scene.add(water);

// ==========================================
// 3. ДЫШАЩИЙ ШАР
// ==========================================
// Позиция покоя — парит над водой по центру
const restPosition = new THREE.Vector3(0, 5, 0); 

const ballGeo = new THREE.SphereGeometry(1.5, 64, 64);
const ballMat = new THREE.MeshStandardMaterial({
    color: 0x4fc3f7, roughness: 0.2, metalness: 0.1,
    emissive: new THREE.Color(0x1a237e), emissiveIntensity: 0.6,
});

// Шейдер "дыхания" и волн на поверхности шара
ballMat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.vertexShader = `
        uniform float uTime;
        ${shader.vertexShader}
    `.replace(
        `#include <begin_vertex>`,
        `
        #include <begin_vertex>
        float wave = sin(position.x * 3.0 + uTime) * cos(position.y * 3.0 + uTime * 0.7) * 0.05;
        transformed += normal * wave;
        `
    );
    ballMat.userData.shader = shader;
};

const ball = new THREE.Mesh(ballGeo, ballMat);
ball.position.copy(restPosition);
scene.add(ball);

// ==========================================
// 4. НЕВИДИМЫЕ ПРУЖИНЫ
// ==========================================
// Точки крепления в пространстве (вокруг шара)
const anchors = [
    new THREE.Vector3(0, 12, 0),   // Сверху
    new THREE.Vector3(0, -2, 0),   // Снизу (под водой)
    new THREE.Vector3(7, 5, 0),    // Справа
    new THREE.Vector3(-7, 5, 0),   // Слева
    new THREE.Vector3(0, 5, 7),    // Спереди
    new THREE.Vector3(0, 5, -7)    // Сзади
];

const springs = [];
const getSpringPoints = (start, end) => {
    const pts = [];
    for (let i = 0; i <= 20; i++) {
        const t = i / 20;
        const p = new THREE.Vector3().lerpVectors(start, end, t);
        if (i > 0 && i < 20) {
            const dir = new THREE.Vector3().subVectors(end, start).normalize();
            const perp = new THREE.Vector3(dir.y, -dir.x, dir.z).normalize();
            p.add(perp.multiplyScalar(Math.sin(t * Math.PI * 8) * 0.1));
        }
        pts.push(p);
    }
    return pts;
};

anchors.forEach(anchor => {
    const geo = new THREE.BufferGeometry().setFromPoints(getSpringPoints(anchor, restPosition));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.6 }));
    scene.add(line);
    springs.push({ line, anchor });
});

// ==========================================
// 5. ФИЗИКА И ИНТЕРАКТИВ
// ==========================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const plane = new THREE.Plane();
let isDragging = false;
const velocity = new THREE.Vector3(0, 0, 0);

const onPointerDown = (e) => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    
    if (raycaster.intersectObject(ball).length > 0) {
        isDragging = true;
        controls.autoRotate = false; // Останавливаем вращение камеры при взаимодействии
        controls.enabled = false;
        
        const camDir = camera.getWorldDirection(new THREE.Vector3());
        plane.setFromNormalAndCoplanarPoint(camDir, ball.position);
        e.stopPropagation();
    }
};

const onPointerMove = (e) => {
    if (!isDragging) return;
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    
    const target = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(plane, target)) {
        ball.position.copy(target);
    }
};

const onPointerUp = () => {
    if (isDragging) {
        isDragging = false;
        controls.enabled = true;
    }
};

renderer.domElement.addEventListener('pointerdown', onPointerDown, { capture: true });
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);

// ==========================================
// 6. АНИМАЦИЯ
// ==========================================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.elapsedTime;

    // Волны на воде
    water.material.uniforms['time'].value += delta;

    // Пульсация света из глубины
    deepLight.intensity = 4 + Math.sin(elapsed * 2) * 2;
    
    // Пульсация света у шара
    orbLight.intensity = 3 + Math.sin(elapsed * 1.5) * 1;
    orbLight.position.copy(ball.position).add(new THREE.Vector3(0, 0, 3));

    // --- Физика шара ---
    if (!isDragging) {
        // Возврат к точке равновесия
        const force = new THREE.Vector3().subVectors(restPosition, ball.position);
        velocity.add(force.multiplyScalar(0.08));
        velocity.multiplyScalar(0.92);
        ball.position.add(velocity.clone().multiplyScalar(delta * 60));
    } else {
        velocity.set(0, 0, 0);
    }

    // Дыхание шара
    const breathScale = 1.0 + Math.sin(elapsed * 1.5) * 0.05;
    ball.scale.set(breathScale, breathScale, breathScale);

    // Обновление волн на поверхности шара
    if (ballMat.userData.shader) {
        ballMat.userData.shader.uniforms.uTime.value = elapsed;
    }

    // Обновление геометрии пружин
    springs.forEach(({ line, anchor }) => {
        line.geometry.setFromPoints(getSpringPoints(anchor, ball.position));
    });

    controls.update();
    renderer.render(scene, camera);
}

// Ресайз
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Запуск
animate();
</script>
</body>
</html>
