<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ночная парковка — Уличный кинотеатр</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: Arial, Helvetica, sans-serif; }
        #info {
            position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.6);
            padding: 10px 20px; border-radius: 8px; pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">🎥 Ночная парковка — Уличный кинотеатр (Three.js, неминифицированный)</div>

    <!-- Подключаем Three.js (неминифицированная версия) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Подключаем OrbitControls для управления камерой -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Скрытый video-элемент для трансляции -->
    <video id="streamVideo" style="display: none;" crossorigin="anonymous" playsinline></video>

    <script>
        // ============================================================
        // 1. БАЗОВЫЕ НАСТРОЙКИ СЦЕНЫ
        // ============================================================

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510); // Тёмно-синий ночной фон
        scene.fog = new THREE.Fog(0x050510, 30, 120); // Лёгкий туман для глубины

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 6, 22);
        camera.lookAt(0, 4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; // Важно для корректных цветов
        document.body.appendChild(renderer.domElement);

        // Управление камерой
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 4, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 5;
        controls.maxDistance = 50;

        // ============================================================
        // 2. ОСВЕЩЕНИЕ (НОЧЬ)
        // ============================================================

        // Мягкий общий свет, имитирующий свет звёзд/луны
        const ambientLight = new THREE.AmbientLight(0x404060, 0.8);
        scene.add(ambientLight);

        // Основной "лунный" свет
        const moonLight = new THREE.DirectionalLight(0x8899bb, 0.5);
        moonLight.position.set(-15, 25, -10);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        moonLight.shadow.camera.left = -30;
        moonLight.shadow.camera.right = 30;
        moonLight.shadow.camera.top = 30;
        moonLight.shadow.camera.bottom = -30;
        scene.add(moonLight);

        // Тёплый свет от экрана (чтобы отбрасывал блики на землю и машины)
        const screenGlow = new THREE.PointLight(0xffaa55, 1.2, 40, 2);
        screenGlow.position.set(0, 6, 5);
        scene.add(screenGlow);

        // Небольшой прожектор, подсвечивающий зону парковки
        const spotLight = new THREE.SpotLight(0xffdd88, 1.5);
        spotLight.position.set(8, 12, 10);
        spotLight.target.position.set(0, 0, 0);
        spotLight.angle = Math.PI / 5;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        scene.add(spotLight);
        scene.add(spotLight.target);

        // ============================================================
        // 3. ЗЕМЛЯ (АСФАЛЬТ)
        // ============================================================

        const groundGeometry = new THREE.PlaneGeometry(80, 80);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a22,
            roughness: 0.9,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Разметка на асфальте (белые полосы)
        const lineMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
        for (let i = -3; i <= 3; i++) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.01, 12), lineMaterial);
            line.position.set(i * 5, 0.01, 0);
            line.receiveShadow = true;
            scene.add(line);
        }

        // ============================================================
        // 4. ЭКРАН КИНОТЕАТРА И КАРКАС
        // ============================================================

        const screenWidth = 16;
        const screenHeight = 9;

        // Белая подложка экрана (на случай, если видео ещё не загрузилось)
        const screenBacking = new THREE.Mesh(
            new THREE.PlaneGeometry(screenWidth, screenHeight),
            new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x222222 })
        );
        screenBacking.position.set(0, 5.5, 1.1);
        screenBacking.receiveShadow = false;
        scene.add(screenBacking);

        // Каркас экрана (тёмные металлические балки)
        const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6, metalness: 0.8 });

        // Верхняя перекладина
        const topBar = new THREE.Mesh(new THREE.BoxGeometry(screenWidth + 1, 0.4, 0.4), frameMaterial);
        topBar.position.set(0, 5.5 + screenHeight / 2 + 0.2, 1.3);
        topBar.castShadow = true;
        scene.add(topBar);

        // Нижняя перекладина
        const bottomBar = new THREE.Mesh(new THREE.BoxGeometry(screenWidth + 1, 0.4, 0.4), frameMaterial);
        bottomBar.position.set(0, 5.5 - screenHeight / 2 - 0.2, 1.3);
        bottomBar.castShadow = true;
        scene.add(bottomBar);

        // Левая стойка
        const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 8, 8), frameMaterial);
        leftPost.position.set(-screenWidth / 2 - 0.7, 4, 1.3);
        leftPost.castShadow = true;
        scene.add(leftPost);

        // Правая стойка
        const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 8, 8), frameMaterial);
        rightPost.position.set(screenWidth / 2 + 0.7, 4, 1.3);
        rightPost.castShadow = true;
        scene.add(rightPost);

        // ============================================================
        // 5. ВИДЕОТРАНСЛЯЦИЯ НА ЭКРАНЕ
        // ============================================================

        const videoElement = document.getElementById('streamVideo');

        // 🔗 Прямой видеопоток (HLS-тест Blender Open Movies, 24/7, CORS открыт)
        const streamUrl = 'https://ireplay.tv/test/blender.m3u8';

        // Для HLS-потоков требуется hls.js (нативный <video> не всегда умеет .m3u8)
        // Подключаем динамически, чтобы не загромождать <head>
        const hlsScript = document.createElement('script');
        hlsScript.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
        hlsScript.onload = () => {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElement.play().catch(e => console.warn('Автовоспроизведение заблокировано:', e));
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari и iOS могут воспроизводить HLS нативно
                videoElement.src = streamUrl;
                videoElement.addEventListener('loadedmetadata', () => {
                    videoElement.play().catch(e => console.warn('Автовоспроизведение заблокировано:', e));
                });
            }
        };
        document.head.appendChild(hlsScript);

        // Создаём видео-текстуру
        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.format = THREE.RGBAFormat;
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        // Материал экрана: видео + лёгкое свечение (emissive), чтобы экран светился в темноте
        const screenMaterial = new THREE.MeshBasicMaterial({
            map: videoTexture,
            side: THREE.FrontSide,
            toneMapped: false // Чтобы цвета видео не затемнялись tone mapping'ом
        });

        const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(screenWidth, screenHeight), screenMaterial);
        screenMesh.position.set(0, 5.5, 1.05); // Чуть впереди подложки
        scene.add(screenMesh);

        // ============================================================
        // 6. МАШИНЫ НА ПАРКОВКЕ
        // ============================================================

        function createCar(color, x, z, rotationY = 0) {
            const carGroup = new THREE.Group();

            // Корпус
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.6 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 4.2), bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            body.receiveShadow = true;
            carGroup.add(body);

            // Кабина
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.3 });
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 2.0), cabinMat);
            cabin.position.set(0, 1.0, -0.3);
            cabin.castShadow = true;
            carGroup.add(cabin);

            // Колёса
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 12);
            const wheelPositions = [
                [-0.9, 0.35, 1.4], [0.9, 0.35, 1.4],
                [-0.9, 0.35, -1.4], [0.9, 0.35, -1.4]
            ];
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            // Фары (светящиеся)
            const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffffaa, emissiveIntensity: 0.8 });
            const headlightGeo = new THREE.SphereGeometry(0.12, 8, 8);
            const headlightL = new THREE.Mesh(headlightGeo, headlightMat);
            headlightL.position.set(-0.6, 0.55, 2.1);
            carGroup.add(headlightL);
            const headlightR = new THREE.Mesh(headlightGeo, headlightMat);
            headlightR.position.set(0.6, 0.55, 2.1);
            carGroup.add(headlightR);

            carGroup.position.set(x, 0, z);
            carGroup.rotation.y = rotationY;
            return carGroup;
        }

        // Расставляем машины
        const carColors = [0xaa2222, 0x2244aa, 0x22aa44, 0xcccccc, 0x8844aa, 0xcc6622];
        const carPositions = [
            { x: -8, z: 8, ry: 0.1 },
            { x: -3, z: 9, ry: -0.05 },
            { x: 3, z: 8.5, ry: 0.05 },
            { x: 8, z: 9, ry: -0.1 },
            { x: -9, z: 14, ry: 0.2 },
            { x: 9, z: 13, ry: -0.15 }
        ];

        carPositions.forEach((pos, i) => {
            const car = createCar(carColors[i % carColors.length], pos.x, pos.z, pos.ry);
            scene.add(car);
        });

        // ============================================================
        // 7. ДОПОЛНИТЕЛЬНЫЕ ДЕТАЛИ: ФОНАРИ, ЗВЁЗДЫ, ТРАВА
        // ============================================================

        // Уличные фонари
        function createStreetLamp(x, z) {
            const lampGroup = new THREE.Group();

            const poleMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.5, metalness: 0.8 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 8, 8), poleMat);
            pole.position.y = 4;
            pole.castShadow = true;
            lampGroup.add(pole);

            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.5), poleMat);
            arm.position.set(0, 7.8, 0.7);
            lampGroup.add(arm);

            const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffeedd, emissive: 0xffcc88, emissiveIntensity: 1.5 });
            const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), bulbMat);
            bulb.position.set(0, 7.8, 1.4);
            lampGroup.add(bulb);

            // Точечный свет от фонаря
            const lampLight = new THREE.PointLight(0xffcc88, 0.8, 20, 2);
            lampLight.position.set(0, 7.8, 1.4);
            lampGroup.add(lampLight);

            lampGroup.position.set(x, 0, z);
            return lampGroup;
        }

        scene.add(createStreetLamp(-14, 5));
        scene.add(createStreetLamp(14, 5));
        scene.add(createStreetLamp(-14, 18));
        scene.add(createStreetLamp(14, 18));

        // Звёзды на небе
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 400;
            starPositions[i + 1] = Math.random() * 100 + 20;
            starPositions[i + 2] = (Math.random() - 0.5) * 400;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // Луна (простая сфера с подсветкой)
        const moon = new THREE.Mesh(
            new THREE.SphereGeometry(3, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xeeddcc })
        );
        moon.position.set(-60, 50, -80);
        scene.add(moon);

        // ============================================================
        // 8. АНИМАЦИЯ И РЕНДЕРИНГ
        // ============================================================

        function animate() {
            requestAnimationFrame(animate);

            // Обновляем текстуру видео
            if (videoElement.readyState >= videoElement.HAVE_CURRENT_DATA) {
                videoTexture.needsUpdate = true;
            }

            // Лёгкое мерцание света от экрана (эффект "живого" кинотеатра)
            const time = Date.now() * 0.002;
            screenGlow.intensity = 1.0 + Math.sin(time) * 0.15;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ============================================================
        // 9. ОБРАБОТКА ИЗМЕНЕНИЯ РАЗМЕРА ОКНА
        // ============================================================

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
